<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6E5B47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="컨시어지">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<title>살롱 컨시어지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F1EC; --paper:#FCFAF6; --ink:#2A2622; --muted:#8C8479;
    --line:#E6DFD4; --accent:#6E5B47; --accent-d:#4E4031; --soft:#EFE9DF;
    --sage:#5C7A57; --sage-bg:#EAF0E6; --gold:#9A7B33; --rose:#B0574A; --rose-bg:#F3E6E2;
    --serif:'Cormorant Garamond',serif;
    --sans:'Pretendard',-apple-system,'Apple SD Gothic Neo',sans-serif;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bot:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;
    line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden;}
  .app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;
    background:var(--paper);position:relative;box-shadow:0 0 50px rgba(42,38,34,.08);}

  /* top bar */
  .bar{padding:calc(var(--safe-top) + 14px) 18px 12px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;background:var(--paper);position:relative;z-index:2;}
  .bar .ttl{font-weight:800;font-size:17px;flex:1;}
  .bar .back{border:none;background:none;font-size:24px;color:var(--accent);cursor:pointer;
    width:34px;height:34px;margin-left:-8px;display:none;}
  .bar.has-back .back{display:block;}

  /* stage / screens */
  .stage{flex:1;overflow:hidden;position:relative;}
  .screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:18px 18px calc(86px + var(--safe-bot));opacity:0;visibility:hidden;
    transform:translateX(20px);transition:opacity .28s ease,transform .28s ease;}
  .screen.active{opacity:1;visibility:visible;transform:none;}
  .screen.exit-left{transform:translateX(-20px);}
  .screen.from-left{transform:translateX(-20px);}

  .hello .e{font-family:var(--serif);font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);}
  .hello h2{font-size:23px;font-weight:800;margin:3px 0 2px;}
  .hello .s{font-size:13px;color:var(--muted);}

  .chips{display:flex;gap:9px;margin:16px 0;}
  .chip{flex:1;background:var(--soft);border-radius:14px;padding:13px 8px;text-align:center;border:none;cursor:pointer;font-family:inherit;}
  .chip .n{font-family:var(--serif);font-size:25px;font-weight:600;color:var(--accent-d);line-height:1;}
  .chip .l{font-size:11px;color:var(--muted);margin-top:5px;}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin:0 0 13px;overflow:hidden;}
  .card .ch{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.5px;padding:13px 15px 4px;text-transform:uppercase;font-family:var(--serif);}
  .li{display:flex;align-items:center;gap:11px;padding:11px 15px;border-top:1px solid var(--line);cursor:pointer;}
  .card .ch + .li{border-top:none;}
  .li .av{width:38px;height:38px;border-radius:50%;background:var(--soft);display:flex;align-items:center;
    justify-content:center;font-weight:700;color:var(--accent);flex-shrink:0;font-size:15px;}
  .li .nm{font-weight:700;font-size:14.5px;}
  .li .sub{font-size:12px;color:var(--muted);margin-top:1px;}
  .li .rt{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;}
  .li .bd{flex:1;min-width:0;}

  .tag{font-size:10px;font-weight:800;border-radius:20px;padding:2px 8px;display:inline-block;}
  .t-bday{background:var(--rose-bg);color:var(--rose);}
  .t-revisit{background:var(--sage-bg);color:var(--sage);}
  .t-season{background:#F2EAD8;color:var(--gold);}

  /* care card */
  .care{border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin:0 0 12px;}
  .care .hd{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .care .nm{font-weight:800;font-size:14.5px;}
  .care .why{font-size:12.5px;color:var(--muted);margin-bottom:9px;}
  .draft{background:#F2ECE1;border-radius:10px;padding:10px 12px;font-size:12.5px;color:#3a332c;line-height:1.55;}
  .draft .lab{font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--accent);font-weight:800;margin-bottom:3px;}
  .row2{display:flex;gap:7px;margin-top:9px;}
  .btn{flex:1;text-align:center;font-size:12.5px;font-weight:800;padding:9px;border-radius:10px;
    background:var(--accent);color:#fff;border:none;cursor:pointer;font-family:inherit;text-decoration:none;display:block;}
  .btn.ghost{background:var(--soft);color:var(--accent-d);}

  /* empty state */
  .empty{text-align:center;padding:42px 24px;color:var(--muted);}
  .empty .ic{font-size:38px;margin-bottom:12px;opacity:.7;}
  .empty .t{font-weight:700;font-size:15px;color:var(--ink);margin-bottom:5px;}
  .empty .d{font-size:13px;line-height:1.6;}

  .sec-h{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.5px;text-transform:uppercase;
    font-family:var(--serif);margin:4px 2px 10px;}

  /* client detail */
  .kv{padding:0 2px;}
  .kv .r{padding:11px 0;border-bottom:1px solid var(--line);}
  .kv .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .kv .v{font-size:14.5px;margin-top:2px;}
  .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .pill{font-size:12px;background:var(--soft);color:var(--accent-d);border-radius:20px;padding:3px 11px;}

  /* exposure */
  .exp-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
  .exp-row:last-child{border-bottom:none;}
  .exp-q{font-size:13px;flex:1;}
  .exp-bar{width:84px;height:7px;background:var(--soft);border-radius:6px;overflow:hidden;}
  .exp-fill{height:100%;background:var(--sage);width:0;transition:width .9s ease;}
  .exp-n{font-size:12px;font-weight:800;color:var(--sage);width:30px;text-align:right;}

  /* stats */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px;}
  .stat{background:var(--soft);border-radius:13px;padding:13px 14px;}
  .stat .n{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--accent-d);line-height:1;}
  .stat .n .u{font-size:13px;font-family:var(--sans);color:var(--muted);font-weight:600;}
  .stat .l{font-size:11.5px;color:var(--muted);margin-top:5px;}
  .stat .d{font-size:11px;font-weight:700;margin-top:3px;}
  .stat .d.up{color:var(--sage);} .stat .d.dn{color:var(--rose);}
  .bars{display:flex;align-items:flex-end;gap:7px;height:96px;padding:6px 2px 0;}
  .bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bars .bar{width:100%;background:var(--accent);border-radius:5px 5px 0 0;min-height:3px;transition:height .7s ease;}
  .bars .bv{font-size:10px;color:var(--muted);margin-bottom:3px;font-weight:700;}
  .bars .bl{font-size:9.5px;color:var(--muted);margin-top:5px;}
  .svc{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);}
  .svc:last-child{border-bottom:none;}
  .svc .sn{font-size:13px;font-weight:600;flex:0 0 38%;}
  .svc .sbar{flex:1;height:8px;background:var(--soft);border-radius:5px;overflow:hidden;}
  .svc .sfill{height:100%;background:var(--sage);border-radius:5px;width:0;transition:width .7s ease;}
  .svc .sc{font-size:11.5px;color:var(--muted);width:42px;text-align:right;}
  .mini-link{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:none;
    font-family:inherit;cursor:pointer;padding:0;color:var(--accent);font-weight:800;font-size:12px;}

  /* form */
  .fld{margin-bottom:13px;}
  .fld label{display:block;font-size:12px;font-weight:700;color:var(--accent-d);margin-bottom:5px;}
  .fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;font-size:16px;font-family:inherit;background:var(--paper);color:var(--ink);}
  .fld textarea{resize:vertical;min-height:54px;line-height:1.5;}
  .fld .hint{font-size:11px;color:var(--muted);margin-top:4px;}
  .fld2{display:flex;gap:9px;} .fld2>.fld{flex:1;}
  .visit-row{display:flex;gap:8px;align-items:center;margin-bottom:7px;}
  .visit-row input{flex:1;}
  .del-x{border:none;background:var(--soft);color:var(--rose);border-radius:8px;width:34px;height:40px;font-size:16px;cursor:pointer;flex:0 0 auto;}
  .mic{border:1px solid var(--line);background:var(--paper);color:var(--accent);border-radius:18px;
    padding:4px 11px;font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit;float:right;margin-top:-2px;}
  .mic.rec{background:#F3E6E2;color:var(--rose);border-color:#E7CFC8;animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .qtags{display:flex;flex-wrap:wrap;gap:7px;}
  .qtag{font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--accent-d);
    border-radius:20px;padding:8px 13px;cursor:pointer;user-select:none;}
  .qtag.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .qtag:active{transform:scale(.96);}

  /* tabbar */
  .tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--paper);
    border-top:1px solid var(--line);padding-bottom:var(--safe-bot);z-index:3;}
  .tab{flex:1;border:none;background:none;padding:9px 0 8px;cursor:pointer;font-family:inherit;color:var(--muted);}
  .tab .i{font-size:20px;line-height:1;}
  .tab .l{font-size:10px;margin-top:3px;font-weight:700;}
  .tab.on{color:var(--accent);}

  /* toast */
  .toast{position:absolute;left:50%;bottom:calc(96px + var(--safe-bot));transform:translateX(-50%) translateY(10px);
    background:var(--accent-d);color:#fff;font-size:13px;font-weight:600;padding:10px 18px;border-radius:30px;
    opacity:0;pointer-events:none;transition:.25s;z-index:5;white-space:nowrap;box-shadow:0 6px 18px rgba(42,38,34,.25);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .reveal{animation:rise .5s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
</style>
</head>
<body>
<div class="app">

  <div class="bar" id="bar">
    <button class="back" id="backBtn" aria-label="뒤로 가기">‹</button>
    <div class="ttl" id="barTitle">컨시어지</div>
  </div>

  <div class="stage" id="stage">

    <!-- 홈 -->
    <section class="screen active" id="s-home" data-title="컨시어지">
      <div class="hello reveal">
        <div class="e" id="homeEyebrow">For the Designer</div>
        <h2 id="homeHi">안녕하세요 👋</h2>
        <div class="s" id="homeSub">오늘 하루도 시작해볼까요</div>
      </div>
      <div class="chips reveal">
        <button class="chip" data-go="s-alerts"><div class="n" id="cBookings">0</div><div class="l">다가오는 예약</div></button>
        <button class="chip" data-go="s-alerts"><div class="n" id="cCare">0</div><div class="l">챙길 고객</div></button>
        <button class="chip" data-go="s-exposure"><div class="n" id="cExp">–</div><div class="l">AI 노출</div></button>
      </div>
      <div id="homeToday"></div>
      <div id="homeStats"></div>
      <div class="card reveal">
        <div class="ch">바로가기</div>
        <div class="li" data-go="s-alerts"><div class="av">🔔</div><div class="bd"><div class="nm">오늘 챙길 고객</div><div class="sub">생일·재방문 시기 자동 정리</div></div><div class="rt">›</div></div>
        <div class="li" data-go="s-clients"><div class="av">👥</div><div class="bd"><div class="nm">고객 카르테</div><div class="sub">지난 시술·취향·대화 메모</div></div><div class="rt">›</div></div>
        <div class="li" data-go="s-exposure"><div class="av">📈</div><div class="bd"><div class="nm">AI 노출 케어</div><div class="sub">검색·AI에 어떻게 보이는지</div></div><div class="rt">›</div></div>
      </div>
    </section>

    <!-- 챙길 고객 -->
    <section class="screen" id="s-alerts" data-title="오늘 챙길 고객">
      <div class="sec-h">자동 발송 X · 내가 직접 한마디</div>
      <div id="alertList"></div>
    </section>

    <!-- 고객 목록 -->
    <section class="screen" id="s-clients" data-title="고객">
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <button class="btn" id="addClientBtn" style="flex:2;">+ 고객 추가</button>
        <button class="btn ghost" id="exportBtn" style="flex:1;">내보내기</button>
        <button class="btn ghost" id="importBtn" style="flex:1;">가져오기</button>
        <input type="file" id="importFile" accept="application/json" style="display:none;">
      </div>
      <div id="clientList"></div>
    </section>

    <!-- 고객 상세 -->
    <section class="screen" id="s-client" data-title="고객 카르테">
      <div id="clientDetail"></div>
    </section>

    <!-- 고객 추가/수정 -->
    <section class="screen" id="s-edit" data-title="고객 추가">
      <div id="editBody"></div>
    </section>

    <!-- AI 노출 -->
    <section class="screen" id="s-exposure" data-title="AI 노출 케어">
      <div id="exposureBody"></div>
    </section>

    <!-- 통계 -->
    <section class="screen" id="s-stats" data-title="기록 · 통계">
      <div id="statsBody"></div>
    </section>

  </div>

  <nav class="tabbar" id="tabbar"></nav>
  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  var stage=document.getElementById('stage');
  var bar=document.getElementById('bar');
  var barTitle=document.getElementById('barTitle');
  var toastEl=document.getElementById('toast');
  var TABS=[['s-home','🏠','홈'],['s-alerts','🔔','알림'],['s-clients','👥','고객'],['s-exposure','📈','노출']];
  var ROOTS=TABS.map(function(t){return t[0];});
  var stack=['s-home'];
  var DATA=null;

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function av(n){return esc(String(n||'·').trim().charAt(0));}
  function dateLabel(ds,todayStr){
    if(!ds) return '';
    if(ds===todayStr) return '오늘';
    var a=new Date(ds+'T00:00:00'), b=new Date(todayStr+'T00:00:00');
    var diff=Math.round((a-b)/86400000);
    if(diff===1) return '내일';
    var wd=['일','월','화','수','목','금','토'][a.getDay()];
    return (a.getMonth()+1)+'.'+a.getDate()+'('+wd+')';
  }

  // ── router ──
  function show(id,dir){
    var cur=stage.querySelector('.screen.active');
    var next=document.getElementById(id);
    if(!next||cur===next){syncBar(id);return;}
    next.classList.remove('exit-left','from-left');
    if(dir==='back')next.classList.add('from-left');
    void next.offsetWidth;
    next.classList.add('active');
    next.classList.remove('from-left');
    next.scrollTop=0;
    if(cur){
      cur.classList.remove('active');
      cur.classList.add(dir==='back'?'exit-left':'exit-left');
      var c=cur;setTimeout(function(){c.classList.remove('exit-left');},300);
    }
    syncBar(id);
  }
  function syncBar(id){
    var sc=document.getElementById(id);
    barTitle.textContent=sc.getAttribute('data-title')||'컨시어지';
    var isRoot=ROOTS.indexOf(id)>=0;
    bar.classList.toggle('has-back',!isRoot);
    renderTabs(id);
  }
  function go(id){ stack.push(id); show(id); }
  function back(){ if(stack.length>1){stack.pop();show(stack[stack.length-1],'back');} }
  function tab(id){ stack=[id]; show(id); }

  document.getElementById('backBtn').addEventListener('click',back);
  document.body.addEventListener('click',function(e){
    var g=e.target.closest('[data-go]'); if(g){go(g.getAttribute('data-go'));return;}
    var c=e.target.closest('[data-client]'); if(c){openClient(c.getAttribute('data-client'));return;}
    var t=e.target.closest('[data-toast]'); if(t){toast(t.getAttribute('data-toast'));return;}
  });

  function renderTabs(active){
    var bar=document.getElementById('tabbar');
    bar.innerHTML=TABS.map(function(t){
      var on=(t[0]===active||(stack[0]===t[0]));
      return '<button class="tab'+(t[0]===active?' on':'')+'" data-tab="'+t[0]+'"><div class="i">'+t[1]+'</div><div class="l">'+t[2]+'</div></button>';
    }).join('');
    bar.querySelectorAll('[data-tab]').forEach(function(b){
      b.addEventListener('click',function(){tab(b.getAttribute('data-tab'));});
    });
  }

  function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){toastEl.classList.remove('show');},1900); }

  // ── empty state ──
  function empty(ic,title,desc){
    return '<div class="empty reveal"><div class="ic">'+ic+'</div><div class="t">'+esc(title)+'</div><div class="d">'+esc(desc)+'</div></div>';
  }

  // ── render: home ──
  function renderHome(){
    var d=DATA;
    var nb=d?(d.bookings||[]).length:0, nc=d?(d.care||[]).length:0;
    document.getElementById('cBookings').textContent=nb;
    document.getElementById('cCare').textContent=nc;
    document.getElementById('cExp').textContent=(d&&d.exposure&&d.exposure.score!=null)?d.exposure.score:'–';
    if(d){
      document.getElementById('homeEyebrow').textContent=(d.designer||'')+(d.salon?(' · '+d.salon):'')||'For the Designer';
      document.getElementById('homeHi').textContent=(d.designer?d.designer+'님, ':'')+'안녕하세요 👋';
      document.getElementById('homeSub').textContent='다가오는 예약 '+nb+' · 챙길 고객 '+nc;
    }
    var box=document.getElementById('homeToday');
    if(d&&d.bookings&&d.bookings.length){
      box.innerHTML='<div class="card reveal"><div class="ch">다가오는 예약</div>'+d.bookings.map(function(b){
        var sub=esc(b.service||'')+(b.time?(' · '+esc(b.time)):'');
        return '<div class="li" data-client="'+esc(b.id)+'"><div class="av">'+av(b.name)+'</div><div class="bd"><div class="nm">'+esc(b.name)+' 님</div><div class="sub">'+sub+'</div></div><div class="rt">'+dateLabel(b.date,d.today)+'</div></div>';
      }).join('')+'</div>';
    } else {
      box.innerHTML='<div class="card"><div class="ch">다가오는 예약</div>'+empty('🗓️','다가오는 예약이 없어요','실시간 예약은 네이버에서 관리 ·\n오늘 챙길 고객은 아침에 동기화돼요')+'</div>';
    }
  }

  // ── render: alerts ──
  function renderAlerts(){
    var box=document.getElementById('alertList');
    var care=DATA?(DATA.care||[]):[];
    if(!care.length){ box.innerHTML=empty('🔔','오늘 챙길 고객이 없어요','생일·리터치 시기가 된 단골이 생기면\n여기에서 알려드려요'); return; }
    var cls={bday:'t-bday',revisit:'t-revisit',season:'t-season'};
    box.innerHTML=care.map(function(c,i){
      var draft=c.draft? '<div class="draft"><div class="lab">추천 문구 (직접 보내기)</div>'+esc(c.draft)+'</div>'

  // ══ 로컬 CRM: 직접 추가·수정 (localStorage + JS 파생) ══════════════
  var SLUG = new URLSearchParams(location.search).get('d') ||
             (typeof PREVIEW_DATA!=='undefined' && PREVIEW_DATA.slug) || 'my';
  var LS_KEY = 'salon_crm_' + SLUG;
  var META = {today: null, designer:'', salon:'', exposure:null, stats:null};
  var CUSTS = [];

  function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){ return null; } }
  function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(CUSTS)); }catch(e){} }
  function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

  // ── 파생 (build_app/drafts/aftercare/relations 의 JS 포팅) ──
  function parseD(s){ if(!s) return null; var m=String(s).match(/(\d{4})-(\d{1,2})-(\d{1,2})/); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
  function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function latest(c){ var bd=null,bs=null; (c.history||[]).forEach(function(h){var d=parseD(h.date); if(d&&(!bd||d>bd)){bd=d;bs=h.service;}}); return {service:bs,date:bd}; }
  function monthsAgo(d,t){ return d?Math.max(1,Math.round((t-d)/2592000000)):null; }
  // 업종별 카피는 빌드(build_app)가 주입한 DATA.config(=kb/copy.yaml) 단일 소스에서.
  // 데이터 없는 단독 실행용 최소 폴백(업종 중립).
  var CONFIG = { benefit:{ default:'시기 맞춰 가볍게 정리하면 더 예쁘게 유지돼요', rules:[] },
                 aftercare:{ default:['가벼운 관리로도 오래 유지돼요. 궁금한 점은 편하게 물어보세요!'], rules:[] } };
  function benefit(s){ s=s||''; var b=CONFIG.benefit||{}, rs=b.rules||[]; for(var i=0;i<rs.length;i++){ if((rs[i].keywords||[]).some(function(k){return s.indexOf(k)>=0;})) return rs[i].text; } return b.default||''; }
  function tipsFor(s){ s=s||''; var a=CONFIG.aftercare||{}, rs=a.rules||[]; for(var i=0;i<rs.length;i++){ if((rs[i].keywords||[]).some(function(k){return s.indexOf(k)>=0;})) return rs[i].tips||[]; } return a.default||[]; }
  function alertsFor(c,t){ var out=[]; var bd=String(c.birthday||''); if(bd){ var p=bd.split('-'); if(p.length>=2 && +p[p.length-2]===t.getMonth()+1 && +p[p.length-1]===t.getDate()) out.push({kind:'bday',label:'생일',why:'오늘 생일'}); }
    var lv=latest(c).date, cyc=+c.care_cycle_days||0; if(lv&&cyc){ var due=new Date(lv.getTime()+cyc*86400000); var dl=Math.round((due-t)/86400000); if(dl<=7){ var svc=latest(c).service||'시술'; out.push({kind:'revisit',label:'재방문',why:svc+' 리터치 시기('+(dl<0?'지남':dl+'일 내')+')'}); } } return out; }
  function draftFor(kind,c,t){ var nm=c.name||'고객'; if(kind==='bday'){ var pr=(c.prefer||[])[0]; return nm+'님 생일 축하드려요 :) '+(pr?pr+' 느낌으로 기분 전환도 좋아요. 편하게 연락 주세요!':'머리도 기분도 새롭게 하고 싶으시면 편하게 연락 주세요!'); }
    if(kind==='revisit'){ var l=latest(c), m=monthsAgo(l.date,t); return (l.service&&m? nm+'님 '+l.service+' 하신 지 '+m+'개월쯤 됐네요. ':nm+'님, 오랜만이에요. ')+benefit(l.service)+' 시간 되실 때 편하게 봐요!'; }
    return nm+'님, 가볍게 정리 어떠세요? 편하게 연락 주세요!'; }
  function resolveRel(cs){ var byId={},brought={}; cs.forEach(function(c){ if(c.id) byId[c.id]=c; }); cs.forEach(function(c){ if(c.referred_by){ (brought[c.referred_by]=brought[c.referred_by]||[]).push(c.id); } });
    var nm=function(id){ return (byId[id]&&byId[id].name)||id; }; var out={};
    cs.forEach(function(c){ if(!c.id) return; out[c.id]={ relations:(c.relations||[]).filter(function(r){return r.to;}).map(function(r){return {id:r.to,name:nm(r.to),type:r.type||'지인'};}),
      referred_by:(c.referred_by&&byId[c.referred_by])?{id:c.referred_by,name:nm(c.referred_by)}:null,
      referred:(brought[c.id]||[]).map(function(i){return {id:i,name:nm(i)};}) }; }); return out; }
  function upcoming(cs,ts){ var rows=[]; cs.forEach(function(c){ var b=c.booking||{}; if(!b.date) return; var d=ymd(parseD(b.date)||new Date()); if(d<ts) return; rows.push({name:c.name,service:b.service,time:b.time,date:d,id:c.id}); }); rows.sort(function(a,b){return (a.date+a.time)<(b.date+b.time)?-1:1;}); return rows; }
  function derive(){
    var ts=META.today||todayStr(), t=parseD(ts)||new Date(); var rel=resolveRel(CUSTS);
    var care=[]; CUSTS.forEach(function(c){ alertsFor(c,t).forEach(function(a){ care.push({id:c.id,name:c.name,kind:a.kind,label:a.label,why:a.why,prefer:c.prefer||[],draft:draftFor(a.kind,c,t)}); }); });
    var ord={bday:0,revisit:1}; care.sort(function(a,b){return (ord[a.kind]==null?9:ord[a.kind])-(ord[b.kind]==null?9:ord[b.kind]);});
    var clients=CUSTS.map(function(c){ var ls=latest(c), info=rel[c.id]||{}; return {id:c.id,name:c.name,memo:c.memo||'',prefer:c.prefer||[],loyalty_visits:c.loyalty_visits||(c.history||[]).length,first_visit:c.first_visit||null,last_visit:ls.date?ymd(ls.date):null,booking:c.booking||null,history:(c.history||[]).slice().sort(function(a,b){return (a.date<b.date)?1:-1;}),aftercare:ls.service?tipsFor(ls.service):[],relations:info.relations||[],referred_by:info.referred_by||null,referred:info.referred||[]}; });
    DATA={slug:SLUG,designer:META.designer,salon:META.salon,today:ts,exposure:META.exposure,stats:META.stats,bookings:upcoming(CUSTS,ts),care:care,clients:clients};
  }
  function refresh(){ derive(); renderAll(); }

      '<div class="fld"><label>총 방문 횟수</label><input id="f-loyal" type="number" inputmode="numeric" value="'+esc(c.loyalty_visits!=null?c.loyalty_visits:'')+'"></div></div>'+

        '<div class="qtags">'+(CONFIG.quick_tags||[]).map(function(t){ var on=(c.prefer||[]).indexOf(t)>=0; return '<span class="qtag'+(on?' on':'')+'" data-quicktag="'+esc(t)+'">'+esc(t)+'</span>'; }).join('')+'</div></div>'+
      '<div class="fld"><label>취향 · 메모 (직접 입력, 쉼표로 구분)</label><textarea id="f-prefer" placeholder="예: 밝은 톤, 손상 신경 씀">'+esc((c.prefer||[]).join(', '))+'</textarea></div>'+
      '<div class="fld"><label>상담 메모 <span style="font-weight:600;color:var(--muted);font-size:11px">(선택)</span><button class="mic" id="micMemo" type="button">🎤 음성</button></label>'+
        '<textarea id="f-memo" placeholder="타이핑하거나, 편하면 🎤 눌러 말해도 돼요">'+esc(c.memo||'')+'</textarea>'+
        '<div class="hint" id="micHint">내 폰에만 저장 · 손님은 모릅니다 · 손님을 녹음하는 게 아니라 내 메모예요</div></div>'+
      '<div class="fld2"><div class="fld"><label>재방문 주기 (일)</label><input id="f-cycle" type="number" inputmode="numeric" placeholder="예: 펌 90 / 새치 28" value="'+esc(c.care_cycle_days||'')+'"><div class="hint">넣으면 리터치 시기에 알림</div></div></div>'+
      '<div class="fld"><label>다음 예약</label><div class="fld2"><input id="f-bdate" type="text" inputmode="numeric" placeholder="YYYY-MM-DD" value="'+esc((c.booking||{}).date||'')+'"><input id="f-bsvc" type="text" placeholder="시술(선택)" value="'+esc((c.booking||{}).service||'')+'"></div></div>'+
      '<div class="fld"><label>시술 이력 <button class="del-x" id="addVisit" type="button" style="color:var(--accent);width:auto;padding:0 10px;height:28px;font-size:12px;font-weight:800;">+ 방문 추가</button></label><div id="visits">'+visits+'</div></div>'+
      '<div class="fld2"><div class="fld"><label>가족·친구</label><select id="f-relto">'+opt(rel0.to)+'</select></div>'+
      '<div class="fld"><label>관계</label><input id="f-reltype" type="text" placeholder="가족/친구/자매" value="'+esc(rel0.type||'')+'"></div></div>'+
      '<div class="fld"><label>소개해주신 분</label><select id="f-refby">'+opt(c.referred_by)+'</select></div>'+
      '<button class="btn" id="saveClient" data-id="'+esc(id||'')+'" style="margin-top:6px;">저장</button>'+
      (id?'<button class="btn ghost" id="delClient" data-id="'+esc(id)+'" style="margin-top:8px;color:var(--rose);">이 고객 삭제</button>':'');
    go('s-edit');
    attachMic(document.getElementById('f-memo'), document.getElementById('micMemo'), document.getElementById('micHint'));
  }

  // ── 음성 입력(브라우저 내장 STT, 비용 0·기기에서) ──
  // iOS Safari 는 말 중간에 자동 종료됨 → 사용자가 멈추기 전엔 자동 재시작해 길게 받아쓴다.
  function attachMic(target, btn, hint){
    if(!btn||!target) return;
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){   // 버튼은 보이게 두고, 탭하면 왜 안 되는지 안내(타이핑·태그는 그대로)
      btn.onclick=function(){ if(hint) hint.textContent='이 환경에선 음성 입력이 안 돼요 — Safari로 열거나 홈 화면에 설치하면 됩니다. (타이핑·빠른 태그는 그대로 사용)'; };
      return;
    }
    var rec=new SR(); rec.lang='ko-KR'; rec.interimResults=true; rec.continuous=true;
    var want=false, base='';
    function begin(){ base=target.value?target.value.replace(/\s+$/,'')+' ':''; try{ rec.start(); }catch(e){} }
    btn.onclick=function(){ if(want){ want=false; rec.stop(); return; } want=true; begin(); };
    rec.onstart=function(){ btn.classList.add('rec'); btn.textContent='● 듣는 중 (탭하면 멈춤)'; if(hint) hint.textContent='말씀하세요…'; };
    rec.onend=function(){ if(want){ begin(); return; }  // 사용자가 멈추기 전엔 자동 이어듣기
      btn.classList.remove('rec'); btn.textContent='🎤 음성 입력'; if(hint) hint.textContent=''; };
    rec.onerror=function(e){ var er=e&&e.error; if(er==='not-allowed'||er==='service-not-allowed'){ want=false; if(hint) hint.textContent='마이크 권한을 허용해 주세요'; } };
    rec.onresult=function(e){ var t=''; for(var i=e.resultIndex;i<e.results.length;i++){ t+=e.results[i][0].transcript; } target.value=base+t; };
  }

  // 빠른 태그 탭 → 취향 칸에 토글(타이핑·녹음 없이 한 번에)
  function toggleQuickTag(el){
    var tag=el.getAttribute('data-quicktag');
    var ta=document.getElementById('f-prefer');
    var list=ta.value.split(',').map(function(s){return s.trim();}).filter(Boolean);
    var i=list.indexOf(tag);
    if(i>=0){ list.splice(i,1); el.classList.remove('on'); } else { list.push(tag); el.classList.add('on'); }
    ta.value=list.join(', ');
  }

  function collectForm(){
    var get=function(id){var e=document.getElementById(id);return e?e.value.trim():'';};
    var visits=[]; document.querySelectorAll('#visits .visit-row').forEach(function(row){
      var dt=row.querySelector('[data-v="date"]').value.trim(), sv=row.querySelector('[data-v="service"]').value.trim();
      if(dt||sv) visits.push({date:dt,service:sv});
    });
    var obj={ name:get('f-name'), birthday:get('f-bday'), memo:get('f-memo'), prefer:get('f-prefer').split(',').map(function(s){return s.trim();}).filter(Boolean), history:visits };
    var loyal=get('f-loyal'); if(loyal) obj.loyalty_visits=+loyal;
    var cyc=get('f-cycle'); if(cyc) obj.care_cycle_days=+cyc;
    var bdate=get('f-bdate'); if(bdate) obj.booking={date:bdate, service:get('f-bsvc')};
    var relto=get('f-relto'), reltype=get('f-reltype'); if(relto) obj.relations=[{to:relto, type:reltype||'지인'}];
    var refby=get('f-refby'); if(refby) obj.referred_by=refby;
    return obj;
  }
  function saveClient(id){
    var obj=collectForm(); if(!obj.name){ toast('이름을 입력해 주세요'); return; }
    if(id){ for(var i=0;i<CUSTS.length;i++){ if(CUSTS[i].id===id){ obj.id=id; CUSTS[i]=obj; break; } } }
    else { obj.id=uid(); CUSTS.push(obj); }
    lsSave(); refresh(); back(); toast('저장했어요');
  }
  function delClient(id){ CUSTS=CUSTS.filter(function(c){return c.id!==id;}); lsSave(); refresh(); stack=['s-clients']; show('s-clients','back'); toast('삭제했어요'); }

  // ── 내보내기 / 가져오기 (백업·기기 이동) ──
  function exportData(){
    var blob=new Blob([JSON.stringify(CUSTS,null,2)],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=SLUG+'-customers.json'; a.click(); toast('백업 파일을 내려받았어요');
  }
  function importData(file){
    var r=new FileReader(); r.onload=function(){ try{ var arr=JSON.parse(r.result); if(Array.isArray(arr)){ CUSTS=arr; lsSave(); refresh(); toast('가져왔어요 ('+arr.length+'명)'); } else toast('형식이 올바르지 않아요'); }catch(e){ toast('읽기 실패'); } }; r.readAsText(file);
  }

  // ── 이벤트 배선 ──
  document.body.addEventListener('click', function(e){
    var qt=e.target.closest('[data-quicktag]'); if(qt){ toggleQuickTag(qt); return; }
    if(e.target.closest('#addClientBtn')){ editClient(null); return; }
    if(e.target.closest('#exportBtn')){ exportData(); return; }
    if(e.target.closest('#importBtn')){ document.getElementById('importFile').click(); return; }
    if(e.target.closest('#addVisit')){ var v=document.getElementById('visits'); var i=v.children.length; v.insertAdjacentHTML('beforeend','<div class="visit-row"><input data-v="date" data-i="'+i+'" type="text" inputmode="numeric" placeholder="YYYY-MM-DD"><input data-v="service" data-i="'+i+'" type="text" placeholder="시술명"><button class="del-x" data-delv="'+i+'" type="button">✕</button></div>'); return; }
    var dv=e.target.closest('[data-delv]'); if(dv){ dv.parentNode.remove(); return; }
    var sv=e.target.closest('#saveClient'); if(sv){ saveClient(sv.getAttribute('data-id')||null); return; }
    var dc=e.target.closest('#delClient'); if(dc){ delClient(dc.getAttribute('data-id')); return; }
    var ed=e.target.closest('[data-edit-client]'); if(ed){ editClient(ed.getAttribute('data-edit-client')); return; }
  });
  document.getElementById('importFile').addEventListener('change', function(e){ if(e.target.files[0]) importData(e.target.files[0]); e.target.value=''; });

  // ── 부팅: 빌드 시드 또는 PREVIEW_DATA → 최초 1회 로컬에 적재, 이후 로컬 우선 ──
  function boot(base){
    META.today=todayStr();
    if(base){ META.designer=base.designer||''; META.salon=base.salon||''; META.exposure=base.exposure||null; META.stats=base.stats||null;
      if(base.config){ CONFIG = base.config; } }     // 업종 카피 단일 소스 주입
    var local=lsLoad();
    CUSTS = (local!=null)? local : ((base&&base.seed)? base.seed.slice() : []);
    if(local==null) lsSave();
    refresh();
  }
  (function start(){
    if(typeof PREVIEW_DATA!=='undefined'){ boot(PREVIEW_DATA); return; }
    var slug=new URLSearchParams(location.search).get('d');
    if(!slug){ boot(null); return; }
    fetch('./data/'+encodeURIComponent(slug)+'.json',{cache:'no-store'})
      .then(function(r){return r.ok?r.json():null;}).then(function(j){ boot(j); }).catch(function(){ boot(null); });
  })();

  renderTabs('s-home');
  syncBar('s-home');
})();
</script>
<script>
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }
</script>
</body>
