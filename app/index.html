<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6E5B47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="컨시어지">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<title>살롱 컨시어지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F1EC; --paper:#FCFAF6; --ink:#2A2622; --muted:#8C8479;
    --line:#E6DFD4; --accent:#6E5B47; --accent-d:#4E4031; --soft:#EFE9DF;
    --sage:#5C7A57; --sage-bg:#EAF0E6; --gold:#9A7B33; --rose:#B0574A; --rose-bg:#F3E6E2;
    --sans:'Pretendard',-apple-system,'Apple SD Gothic Neo',sans-serif;
    --serif:'Pretendard',-apple-system,'Apple SD Gothic Neo',sans-serif;  /* 숫자·영문 라벨은 Pretendard(또렷) */
    --myeongjo:'Nanum Myeongjo',serif;                                    /* 한글 이름·신호 포인트(B=700) */
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bot:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;
    line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden;}
  .app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;
    background:var(--paper);position:relative;box-shadow:0 0 50px rgba(42,38,34,.08);}

  /* top bar */
  .bar{padding:calc(var(--safe-top) + 14px) 18px 12px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;background:var(--paper);position:relative;z-index:2;}
  .bar .ttl{font-weight:800;font-size:17px;flex:1;}
  .bar .back{border:none;background:none;font-size:24px;color:var(--accent);cursor:pointer;
    width:34px;height:34px;margin-left:-8px;display:none;}
  .bar.has-back .back{display:block;}

  /* stage / screens */
  .stage{flex:1;overflow:hidden;position:relative;}
  .screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:18px 18px calc(86px + var(--safe-bot));opacity:0;visibility:hidden;
    transform:translateX(20px);transition:opacity .28s ease,transform .28s ease;}
  .screen.active{opacity:1;visibility:visible;transform:none;}
  .screen.exit-left{transform:translateX(-20px);}
  .screen.from-left{transform:translateX(-20px);}

  .hello .e{font-family:var(--serif);font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);}
  .hello h2{font-size:23px;font-weight:800;margin:3px 0 2px;}
  .hello .s{font-size:13px;color:var(--muted);}

  .chips{display:flex;gap:9px;margin:16px 0;}
  .chip{flex:1;background:var(--soft);border-radius:14px;padding:13px 8px;text-align:center;border:none;cursor:pointer;font-family:inherit;}
  .chip .n{font-family:var(--serif);font-size:25px;font-weight:600;color:var(--accent-d);line-height:1;}
  .chip .l{font-size:11px;color:var(--muted);margin-top:5px;}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin:0 0 13px;overflow:hidden;}
  .card .ch{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.5px;padding:13px 15px 4px;text-transform:uppercase;font-family:var(--serif);}
  .li{display:flex;align-items:center;gap:11px;padding:11px 15px;border-top:1px solid var(--line);cursor:pointer;}
  .card .ch + .li{border-top:none;}
  .li .av{width:38px;height:38px;border-radius:50%;background:var(--soft);display:flex;align-items:center;
    justify-content:center;font-weight:700;color:var(--accent);flex-shrink:0;font-size:15px;}
  .li .nm{font-weight:700;font-size:14.5px;}
  .li .sub{font-size:12px;color:var(--muted);margin-top:1px;}
  .li .rt{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;}
  .li .bd{flex:1;min-width:0;}

  .tag{font-size:10px;font-weight:800;border-radius:20px;padding:2px 8px;display:inline-block;}
  .t-bday{background:var(--rose-bg);color:var(--rose);}
  .t-revisit{background:var(--sage-bg);color:var(--sage);}
  .t-season{background:#F2EAD8;color:var(--gold);}

  /* care card */
  .care{border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin:0 0 12px;}
  .care .hd{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .care .nm{font-weight:800;font-size:14.5px;}
  .care .why{font-size:12.5px;color:var(--muted);margin-bottom:9px;}
  .draft{background:#F2ECE1;border-radius:10px;padding:10px 12px;font-size:12.5px;color:#3a332c;line-height:1.55;}
  .draft .lab{font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--accent);font-weight:800;margin-bottom:3px;}
  .row2{display:flex;gap:7px;margin-top:9px;}
  .btn{flex:1;text-align:center;font-size:12.5px;font-weight:800;padding:9px;border-radius:10px;
    background:var(--accent);color:#fff;border:none;cursor:pointer;font-family:inherit;text-decoration:none;display:block;}
  .btn.ghost{background:var(--soft);color:var(--accent-d);}

  /* empty state */
  .empty{text-align:center;padding:42px 24px;color:var(--muted);}
  .empty .ic{font-size:38px;margin-bottom:12px;opacity:.7;}
  .empty .t{font-weight:700;font-size:15px;color:var(--ink);margin-bottom:5px;}
  .empty .d{font-size:13px;line-height:1.6;}

  .sec-h{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.5px;text-transform:uppercase;
    font-family:var(--serif);margin:4px 2px 10px;}

  /* client detail */
  .kv{padding:0 2px;}
  .kv .r{padding:11px 0;border-bottom:1px solid var(--line);}
  .kv .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .kv .v{font-size:14.5px;margin-top:2px;}
  .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .pill{font-size:12px;background:var(--soft);color:var(--accent-d);border-radius:20px;padding:3px 11px;}

  /* exposure */
  .exp-row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
  .exp-row:last-child{border-bottom:none;}
  .exp-q{font-size:13px;flex:1;line-height:1.4;}
  .exp-tags{display:flex;gap:5px;flex-shrink:0;margin-top:1px;}
  .exp-t{font-size:10px;font-weight:800;border-radius:8px;padding:3px 7px;white-space:nowrap;}
  .exp-t.on{background:var(--sage-bg);color:var(--sage);} .exp-t.off{background:var(--soft);color:var(--muted);}
  .exp-t.nv{background:#EAF0F6;color:#3D6A99;}
  /* 하예원님께 — 디자이너용 '이번 주 딱 하나' 카드 */
  .dcard{background:linear-gradient(160deg,#FBF6EC,#F6EEDD);border:1px solid #E8D9B8;border-radius:16px;padding:17px 17px 15px;margin-bottom:13px;box-shadow:0 2px 10px rgba(176,141,87,.10);}
  .dcard .dc-h{font-family:var(--serif);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);}
  .dcard .dc-copy{float:right;border:1px solid #E0CB9E;background:#fff;color:var(--gold);font-family:inherit;font-weight:700;font-size:10.5px;border-radius:8px;padding:3px 9px;cursor:pointer;letter-spacing:0;text-transform:none;}
  .dcard .dc-g{font-family:var(--serif);font-size:18px;font-weight:800;color:var(--accent-d);margin-top:3px;}
  .dcard .dc-good{display:inline-block;font-size:11.5px;font-weight:700;color:var(--sage);background:var(--sage-bg);border-radius:8px;padding:3px 9px;margin-top:9px;}
  .dcard .dc-ask{font-size:13.5px;color:var(--ink);margin-top:11px;line-height:1.55;}
  .dcard .dc-do{font-size:15px;font-weight:800;color:var(--accent-d);margin-top:7px;line-height:1.5;background:#fff;border-radius:11px;padding:11px 13px;border:1px dashed #E0CB9E;}
  .dcard .dc-f{font-size:11.5px;color:var(--muted);margin-top:10px;}
  /* 발견 점수 헤더 + 추세 */
  .exp-score{display:flex;align-items:center;gap:16px;}
  .exp-score .big{font-size:46px;font-weight:800;line-height:1;color:var(--accent-d);}
  .exp-score .lab{font-size:11px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;}
  .exp-spark{display:flex;align-items:flex-end;gap:4px;height:42px;}
  .exp-spark .sb{width:9px;background:var(--sage);border-radius:3px 3px 0 0;min-height:4px;}
  .exp-delta{font-size:12px;font-weight:800;}
  /* 이번 주 할 일 */
  .exp-act{border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:9px;border-left:3px solid var(--gold);}
  .exp-act .t{font-weight:800;font-size:14px;}
  .exp-act .w{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;}
  .exp-act .e{display:inline-block;margin-top:7px;font-size:10.5px;font-weight:800;background:#F2EAD8;color:var(--gold);border-radius:8px;padding:2px 8px;}

  /* stats */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px;}
  .stat{background:var(--soft);border-radius:13px;padding:13px 14px;}
  .stat .n{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--accent-d);line-height:1;}
  .stat .n .u{font-size:13px;font-family:var(--sans);color:var(--muted);font-weight:600;}
  .stat .l{font-size:11.5px;color:var(--muted);margin-top:5px;}
  .stat .d{font-size:11px;font-weight:700;margin-top:3px;}
  .stat .d.up{color:var(--sage);} .stat .d.dn{color:var(--rose);}
  .bars{display:flex;align-items:flex-end;gap:7px;height:96px;padding:6px 2px 0;}
  .bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bars .bar{width:100%;background:var(--accent);border-radius:5px 5px 0 0;min-height:3px;transition:height .7s ease;}
  .bars .bv{font-size:10px;color:var(--muted);margin-bottom:3px;font-weight:700;}
  .bars .bl{font-size:9.5px;color:var(--muted);margin-top:5px;}
  .svc{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);}
  .svc:last-child{border-bottom:none;}
  .svc .sn{font-size:13px;font-weight:600;flex:0 0 38%;}
  .svc .sbar{flex:1;height:8px;background:var(--soft);border-radius:5px;overflow:hidden;}
  .svc .sfill{height:100%;background:var(--sage);border-radius:5px;width:0;transition:width .7s ease;}
  .svc .sc{font-size:11.5px;color:var(--muted);width:42px;text-align:right;}
  .mini-link{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:none;
    font-family:inherit;cursor:pointer;padding:0;color:var(--accent);font-weight:800;font-size:12px;}

  /* form */
  .fld{margin-bottom:13px;}
  .fld label{display:block;font-size:12px;font-weight:700;color:var(--accent-d);margin-bottom:5px;}
  .fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;font-size:16px;font-family:inherit;background:var(--paper);color:var(--ink);}
  .fld textarea{resize:vertical;min-height:54px;line-height:1.5;}
  .fld .hint{font-size:11px;color:var(--muted);margin-top:4px;}
  .fld2{display:flex;gap:9px;} .fld2>.fld{flex:1;}
  .visit-row{display:flex;gap:8px;align-items:center;margin-bottom:7px;}
  .visit-row input{flex:1;}
  .del-x{border:none;background:var(--soft);color:var(--rose);border-radius:8px;width:34px;height:40px;font-size:16px;cursor:pointer;flex:0 0 auto;}
  .mic{border:1px solid var(--line);background:var(--paper);color:var(--accent);border-radius:18px;
    padding:4px 11px;font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit;float:right;margin-top:-2px;}
  .mic.rec{background:#F3E6E2;color:var(--rose);border-color:#E7CFC8;animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .qtags{display:flex;flex-wrap:wrap;gap:7px;}
  .qtag{font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--accent-d);
    border-radius:20px;padding:8px 13px;cursor:pointer;user-select:none;}
  .qtag.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .qtag:active{transform:scale(.96);}

  /* 고객 뷰 전환 */
  .vsw{display:flex;gap:5px;margin-bottom:9px;background:var(--soft);border-radius:11px;padding:3px;}
  .vsw button{flex:1;border:none;background:none;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--muted);
    padding:7px 0;border-radius:8px;cursor:pointer;}
  .vsw button.on{background:var(--paper);color:var(--accent-d);box-shadow:0 1px 3px rgba(42,38,34,.1);}
  /* 뷰: 특징 카드 */
  .cv-feat{font-size:12.5px;color:var(--ink);line-height:1.5;background:#F2ECE1;border-radius:9px;padding:8px 10px;margin:7px 0;}
  /* 뷰: 그룹 섹션 */
  .cv-sec{font-size:11px;font-weight:800;color:var(--accent);background:var(--soft);padding:6px 13px;letter-spacing:.5px;}
  /* 뷰: 격자 */
  .cv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .cv-g{border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center;cursor:pointer;}
  .cv-g .av{margin:0 auto 7px;}
  .cv-g .gn{font-weight:700;font-size:13.5px;}
  .cv-g .gs{font-size:10.5px;color:var(--muted);margin-top:2px;}
  /* 아바타 등급 링 + 상태색 */
  .av.r-gold{box-shadow:0 0 0 2px var(--gold);} .av.r-sage{box-shadow:0 0 0 2px var(--sage);}
  .av.r-rose{box-shadow:0 0 0 2px var(--rose);}
  .st-due{color:var(--rose);font-weight:800;font-size:11px;} .st-new{color:var(--sage);font-weight:800;font-size:11px;}
  .st-rec{color:var(--muted);font-size:11px;text-align:right;}
  .t-risk{background:var(--rose);color:#fff;}
  .t-vip{background:var(--gold);color:#fff;letter-spacing:.3px;}
  /* 신호/매출 요약 바 */
  .rv-bar{display:flex;gap:6px;margin-bottom:10px;}
  .rv-bar span{flex:1;text-align:center;font-size:11.5px;font-weight:800;border-radius:9px;padding:7px 4px;}
  .rv-bar .rv-x{background:var(--rose);color:#fff;}
  .rv-bar .rv-d{background:#F2EAD8;color:var(--gold);}
  .rv-bar .rv-n{background:var(--sage-bg);color:var(--sage);}
  .rv-bar .rv-v{background:var(--gold);color:#fff;}
  .rnk{flex:0 0 28px;width:28px;height:28px;border-radius:8px;background:var(--soft);color:var(--accent-d);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .focus-pill{display:inline-block;margin:0 0 10px;border:none;background:var(--accent-d);color:#fff;font-family:inherit;font-weight:700;font-size:12px;border-radius:20px;padding:6px 13px;cursor:pointer;}
  .sig{font-weight:800;font-size:11.5px;}
  .hist-collapsed .li:nth-child(n+4){display:none;}   /* 이력 많으면 최근 3건만, 상세보기로 펼침 */
  .famrow{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  /* 가족 연결 피커(바텀시트) */
  .fam-ov{position:fixed;inset:0;background:rgba(30,26,22,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
  .fam-box{background:var(--paper);width:100%;max-width:440px;border-radius:18px 18px 0 0;padding:16px 15px 22px;max-height:78vh;display:flex;flex-direction:column;}
  .fam-hd{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:11px;}
  #famSearch{border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:15px;font-family:inherit;background:var(--paper);color:var(--ink);margin-bottom:8px;}
  #famResults{overflow-y:auto;}
  .fam-types{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .fam-types button{border:1px solid var(--line);background:var(--paper);color:var(--muted);font-family:inherit;
    font-size:13px;font-weight:700;border-radius:20px;padding:6px 13px;cursor:pointer;}
  .fam-types button.on{background:var(--sage);color:#fff;border-color:var(--sage);}
  /* 홈 신호 요약 + 민감도 토글 */
  .hsig{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:7px;margin:0 0 10px;}
  .hsig button{border:1px solid var(--line);background:var(--paper);border-radius:13px;padding:11px 4px 9px;font-family:inherit;cursor:pointer;text-align:center;}
  .hsig .hn{font-size:21px;font-weight:800;line-height:1;}
  .hsig .hl{font-size:10.5px;color:var(--muted);margin-top:4px;font-weight:600;}
  .hsig .x .hn{color:var(--rose);} .hsig .d .hn{color:var(--gold);} .hsig .n .hn{color:var(--sage);} .hsig .v .hn{color:var(--gold);}
  .hsens{display:flex;align-items:center;gap:8px;margin:0 2px 14px;}
  .hsens .lab{font-size:11.5px;color:var(--muted);font-weight:600;flex:1;}
  .seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;}
  .seg button{border:none;background:none;font-family:inherit;font-size:12px;font-weight:700;color:var(--muted);padding:5px 11px;border-radius:8px;cursor:pointer;}
  .seg button.on{background:var(--paper);color:var(--accent-d);box-shadow:0 1px 3px rgba(42,38,34,.1);}

  /* tabbar */
  .tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--paper);
    border-top:1px solid var(--line);padding-bottom:var(--safe-bot);z-index:3;}
  .tab{flex:1;border:none;background:none;padding:9px 0 8px;cursor:pointer;font-family:inherit;color:var(--muted);}
  .tab .i{font-size:20px;line-height:1;}
  .tab .l{font-size:10px;margin-top:3px;font-weight:700;}
  .tab.on{color:var(--accent);}

  /* toast */
  .toast{position:absolute;left:50%;bottom:calc(96px + var(--safe-bot));transform:translateX(-50%) translateY(10px);
    background:var(--accent-d);color:#fff;font-size:13px;font-weight:600;padding:10px 18px;border-radius:30px;
    opacity:0;pointer-events:none;transition:.25s;z-index:5;white-space:nowrap;box-shadow:0 6px 18px rgba(42,38,34,.25);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .reveal{animation:rise .5s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}}

  /* ── 타입: 한글 이름·신호·인사는 나눔명조 700(우아), 그 외(본문·숫자·영문)는 Pretendard(또렷) ── */
  .hello h2{font-family:var(--myeongjo);font-weight:700;}
  #clientDetail h2{font-family:var(--myeongjo);font-weight:700;}
  #clientList .li .nm{font-family:var(--myeongjo);font-weight:700;}
  .cv-g .gn{font-family:var(--myeongjo);font-weight:700;}
  .care .nm{font-family:var(--myeongjo);font-weight:700;}
  .sig{font-family:var(--myeongjo);font-weight:700;}
  .tag{font-family:var(--sans);}   /* VIP·신호 칩 영문은 또렷하게 */
</style>
</head>
<body>
<div class="app">

  <div class="bar" id="bar">
    <button class="back" id="backBtn" aria-label="뒤로 가기">‹</button>
    <div class="ttl" id="barTitle">컨시어지</div>
  </div>

  <div class="stage" id="stage">

    <!-- 홈 -->
    <section class="screen active" id="s-home" data-title="컨시어지">
      <div class="hello reveal">
        <div class="e" id="homeEyebrow">For the Designer</div>
        <h2 id="homeHi">안녕하세요 👋</h2>
        <div class="s" id="homeSub">오늘 하루도 시작해볼까요</div>
      </div>
      <div class="chips reveal">
        <button class="chip" data-go="s-alerts"><div class="n" id="cBookings">0</div><div class="l">다가오는 예약</div></button>
        <button class="chip" data-go="s-alerts"><div class="n" id="cCare">0</div><div class="l">챙길 고객</div></button>
        <button class="chip" data-go="s-exposure"><div class="n" id="cExp">–</div><div class="l">AI 노출</div></button>
      </div>
      <div id="homeSignals" class="reveal"></div>
      <div id="homeToday"></div>
      <div id="homeStats"></div>
      <div class="card reveal">
        <div class="ch">바로가기</div>
        <div class="li" data-go="s-alerts"><div class="av">🔔</div><div class="bd"><div class="nm">오늘 챙길 고객</div><div class="sub">생일·재방문 시기 자동 정리</div></div><div class="rt">›</div></div>
        <div class="li" data-go="s-clients"><div class="av">👥</div><div class="bd"><div class="nm">고객 카르테</div><div class="sub">지난 시술·취향·대화 메모</div></div><div class="rt">›</div></div>
        <div class="li" data-go="s-exposure"><div class="av">📈</div><div class="bd"><div class="nm">AI 노출 케어</div><div class="sub">검색·AI에 어떻게 보이는지</div></div><div class="rt">›</div></div>
      </div>
    </section>

    <!-- 챙길 고객 -->
    <section class="screen" id="s-alerts" data-title="오늘 챙길 고객">
      <div class="sec-h">자동 발송 X · 내가 직접 한마디</div>
      <div id="alertList"></div>
    </section>

    <!-- 고객 목록 -->
    <section class="screen" id="s-clients" data-title="고객">
      <div style="display:flex;gap:8px;margin-bottom:9px;">
        <button class="btn" id="addClientBtn" style="flex:2;">+ 고객 추가</button>
        <button class="btn ghost" id="exportBtn" style="flex:1;">내보내기</button>
        <button class="btn ghost" id="importBtn" style="flex:1;">가져오기</button>
        <input type="file" id="importFile" accept="application/json" style="display:none;">
      </div>
      <div class="vsw" id="clientViews">
        <button data-view="list" class="on">목록</button>
        <button data-view="grid">격자</button>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:11px;">
        <input id="clientSearch" type="search" placeholder="이름·고객번호·태그·특징 검색"
          style="flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit;background:var(--paper);color:var(--ink);">
        <select id="clientSort" style="border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:13px;font-family:inherit;background:var(--paper);color:var(--accent-d);">
          <option value="visits">방문 많은순</option>
          <option value="revenue">매출 많은순</option>
          <option value="recent">최근 방문순</option>
          <option value="name">이름순</option>
        </select>
      </div>
      <div class="sec-h" id="clientCount" style="margin:0 2px 8px;"></div>
      <div id="clientList"></div>
    </section>

    <!-- 고객 상세 -->
    <section class="screen" id="s-client" data-title="고객 카르테">
      <div id="clientDetail"></div>
    </section>

    <!-- 고객 추가/수정 -->
    <section class="screen" id="s-edit" data-title="고객 추가">
      <div id="editBody"></div>
    </section>

    <!-- AI 노출 -->
    <section class="screen" id="s-exposure" data-title="AI 노출 케어">
      <div id="exposureBody"></div>
    </section>

    <!-- 통계 -->
    <section class="screen" id="s-stats" data-title="기록 · 통계">
      <div id="statsBody"></div>
    </section>

  </div>

  <nav class="tabbar" id="tabbar"></nav>
  <div class="toast" id="toast"></div>

  <!-- 가족 연결 피커 -->
  <div class="fam-ov" id="famPicker" style="display:none">
    <div class="fam-box">
      <div class="fam-hd"><span>가족 · 동반 연결</span><button class="del-x" id="famClose" type="button">✕</button></div>
      <div class="fam-types" id="famTypes">
        <button data-famtype="가족" class="on" type="button">가족</button>
        <button data-famtype="자녀" type="button">자녀</button>
        <button data-famtype="부모" type="button">부모</button>
        <button data-famtype="배우자" type="button">배우자</button>
        <button data-famtype="형제" type="button">형제</button>
        <button data-famtype="지인" type="button">지인</button>
      </div>
      <input id="famSearch" type="search" placeholder="연결할 고객 이름 검색" autocomplete="off">
      <div id="famResults"></div>
    </div>
  </div>
</div>

<script>
(function(){
  var stage=document.getElementById('stage');
  var bar=document.getElementById('bar');
  var barTitle=document.getElementById('barTitle');
  var toastEl=document.getElementById('toast');
  var TABS=[['s-home','🏠','홈'],['s-alerts','🔔','알림'],['s-clients','👥','고객'],['s-exposure','📈','노출']];
  var ROOTS=TABS.map(function(t){return t[0];});
  var stack=['s-home'];
  var DATA=null;

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function av(n){return esc(String(n||'·').trim().charAt(0));}
  function dateLabel(ds,todayStr){
    if(!ds) return '';
    if(ds===todayStr) return '오늘';
    var a=new Date(ds+'T00:00:00'), b=new Date(todayStr+'T00:00:00');
    var diff=Math.round((a-b)/86400000);
    if(diff===1) return '내일';
    var wd=['일','월','화','수','목','금','토'][a.getDay()];
    return (a.getMonth()+1)+'.'+a.getDate()+'('+wd+')';
  }

  // ── router ──
  function show(id,dir){
    var cur=stage.querySelector('.screen.active');
    var next=document.getElementById(id);
    if(!next||cur===next){syncBar(id);return;}
    next.classList.remove('exit-left','from-left');
    if(dir==='back')next.classList.add('from-left');
    void next.offsetWidth;
    next.classList.add('active');
    next.classList.remove('from-left');
    next.scrollTop=0;
    if(cur){
      cur.classList.remove('active');
      cur.classList.add(dir==='back'?'exit-left':'exit-left');
      var c=cur;setTimeout(function(){c.classList.remove('exit-left');},300);
    }
    syncBar(id);
  }
  function syncBar(id){
    var sc=document.getElementById(id);
    barTitle.textContent=sc.getAttribute('data-title')||'컨시어지';
    var isRoot=ROOTS.indexOf(id)>=0;
    bar.classList.toggle('has-back',!isRoot);
    renderTabs(id);
  }
  function go(id){ stack.push(id); show(id); }
  function back(){ if(stack.length>1){stack.pop();show(stack[stack.length-1],'back');} }
  function tab(id){ stack=[id]; show(id); }

  document.getElementById('backBtn').addEventListener('click',back);
  document.body.addEventListener('click',function(e){
    var sx=e.target.closest('[data-sens]'); if(sx){ sensKey=sx.getAttribute('data-sens'); try{localStorage.setItem('crm_sens',sensKey);}catch(_){} refresh(); return; }
    var fx=e.target.closest('[data-focus]'); if(fx){ clientFocus=fx.getAttribute('data-focus');
      var vw=fx.getAttribute('data-view'); if(vw){ clientView=vw; try{localStorage.setItem('crm_view',clientView);}catch(_){} }
      tab('s-clients'); paintClientViews(); renderClients(); return; }
    var cf=e.target.closest('[data-clearfocus]'); if(cf){ clientFocus=null; renderClients(); return; }
    var g=e.target.closest('[data-go]'); if(g){go(g.getAttribute('data-go'));return;}
    var c=e.target.closest('[data-client]'); if(c){openClient(c.getAttribute('data-client'));return;}
    var t=e.target.closest('[data-toast]'); if(t){toast(t.getAttribute('data-toast'));return;}
  });

  function renderTabs(active){
    var bar=document.getElementById('tabbar');
    bar.innerHTML=TABS.map(function(t){
      var on=(t[0]===active||(stack[0]===t[0]));
      return '<button class="tab'+(t[0]===active?' on':'')+'" data-tab="'+t[0]+'"><div class="i">'+t[1]+'</div><div class="l">'+t[2]+'</div></button>';
    }).join('');
    bar.querySelectorAll('[data-tab]').forEach(function(b){
      b.addEventListener('click',function(){tab(b.getAttribute('data-tab'));});
    });
  }

  function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){toastEl.classList.remove('show');},1900); }

  // ── empty state ──
  function empty(ic,title,desc){
    return '<div class="empty reveal"><div class="ic">'+ic+'</div><div class="t">'+esc(title)+'</div><div class="d">'+esc(desc)+'</div></div>';
  }

  // ── render: home ──
  function renderHome(){
    var d=DATA;
    var nb=d?(d.bookings||[]).length:0, nc=d?(d.care||[]).length:0;
    document.getElementById('cBookings').textContent=nb;
    document.getElementById('cCare').textContent=nc;
    document.getElementById('cExp').textContent=(d&&d.exposure&&d.exposure.score!=null)?d.exposure.score:'–';
    if(d){
      document.getElementById('homeEyebrow').textContent=(d.designer||'')+(d.salon?(' · '+d.salon):'')||'For the Designer';
      document.getElementById('homeHi').textContent=(d.designer?d.designer+'님, ':'')+'안녕하세요 👋';
      document.getElementById('homeSub').textContent='다가오는 예약 '+nb+' · 챙길 고객 '+nc;
    }
    renderHomeSignals();
    var box=document.getElementById('homeToday');
    if(d&&d.bookings&&d.bookings.length){
      box.innerHTML='<div class="card reveal"><div class="ch">다가오는 예약</div>'+d.bookings.map(function(b){
        var sub=esc(b.service||'')+(b.time?(' · '+esc(b.time)):'');
        return '<div class="li" data-client="'+esc(b.id)+'"><div class="av">'+av(b.name)+'</div><div class="bd"><div class="nm">'+esc(b.name)+' 님</div><div class="sub">'+sub+'</div></div><div class="rt">'+dateLabel(b.date,d.today)+'</div></div>';
      }).join('')+'</div>';
    } else {
      box.innerHTML='<div class="card"><div class="ch">다가오는 예약</div>'+empty('🗓️','다가오는 예약이 없어요','실시간 예약은 네이버에서 관리 ·\n오늘 챙길 고객은 아침에 동기화돼요')+'</div>';
    }
  }

  // ── render: 홈 신호 요약(이탈위험·재방문도래·신규·VIP) + 민감도 토글 ──
  function renderHomeSignals(){
    var box=document.getElementById('homeSignals'); if(!box) return;
    var cl=DATA?(DATA.clients||[]):[];
    if(!cl.length){ box.innerHTML=''; return; }
    var n={overdue:0,due:0,'new':0,vip:0};
    cl.forEach(function(c){ if(n[c.revisit_state]!=null)n[c.revisit_state]++; if(c.tier==='vip')n.vip++; });
    var due2=n.overdue+n.due;
    box.innerHTML=
      '<div class="hsig">'+
        '<button class="x" data-focus="overdue" data-view="list"><div class="hn">'+n.overdue+'</div><div class="hl">이탈위험</div></button>'+
        '<button class="d" data-focus="due" data-view="list"><div class="hn">'+n.due+'</div><div class="hl">재방문도래</div></button>'+
        '<button class="n" data-focus="new" data-view="list"><div class="hn">'+n['new']+'</div><div class="hl">신규</div></button>'+
        '<button class="v" data-focus="vip" data-view="list"><div class="hn">'+n.vip+'</div><div class="hl">VIP</div></button>'+
      '</div>'+
      '<div class="hsens"><div class="lab">오늘 챙길 '+due2+'명 · 신호 민감도</div>'+
        '<div class="seg" id="homeSens">'+['loose','normal','sharp'].map(function(k){
          return '<button data-sens="'+k+'"'+(sensKey===k?' class="on"':'')+'>'+SENS_PRESETS[k].label+'</button>';
        }).join('')+'</div></div>';
  }

  // ── render: alerts ──
  function renderAlerts(){
    var box=document.getElementById('alertList');
    var care=DATA?(DATA.care||[]):[];
    if(!care.length){ box.innerHTML=empty('🔔','오늘 챙길 고객이 없어요','생일·리터치 시기가 된 단골이 생기면\n여기에서 알려드려요'); return; }
    var cls={bday:'t-bday',atrisk:'t-risk',revisit:'t-revisit',season:'t-season'};
    box.innerHTML=care.map(function(c,i){
      var draft=c.draft? '<div class="draft"><div class="lab">추천 문구 (직접 보내기)</div>'+esc(c.draft)+'</div>'
        : '<div class="draft"><div class="lab">추천 문구</div><span style="color:var(--muted)">내 말투로 곧 채워드려요</span></div>';
      return '<div class="care reveal" style="animation-delay:'+(i*0.06)+'s">'+
        '<div class="hd"><span class="tag '+(cls[c.kind]||'t-season')+'">'+esc(c.label)+'</span><span class="nm">'+esc(c.name)+' 님</span></div>'+
        '<div class="why">'+esc(c.why)+'</div>'+draft+
        '<div class="row2"><button class="btn" data-toast="'+esc(c.name)+'님 — 카톡으로 직접 보내기">카톡으로 직접</button>'+
        (c.id?'<button class="btn ghost" data-client="'+esc(c.id)+'">고객 보기</button>':'<button class="btn ghost" data-toast="문구 수정">문구 수정</button>')+'</div></div>';
    }).join('');
  }

  // ── render: clients (5뷰 전환) ──
  var clientQuery='', clientSortKey='visits', clientFocus=null;
  var clientView=(function(){try{var v=localStorage.getItem('crm_view')||'list'; return (v==='grid')?'grid':'list';}catch(e){return 'list';}})();  // 제거된 뷰는 목록으로 폴백
  function focusLabel(f){ return {overdue:'이탈 위험',due:'재방문 도래','new':'신규',vip:'VIP'}[f]||f; }
  function cdays(c){ return (c.days_since==null)? null : c.days_since; }   // derive가 기준일(META.today)로 계산한 값 재사용
  function ctier(c){ var v=c.loyalty_visits||0; return v>=4?'단골':(v<=1?'신규':'일반'); }
  function csvc(c){ return (c.history&&c.history[0]&&c.history[0].service)||(c.booking&&c.booking.service)||''; }
  function vipBadge(c){ return c.tier==='vip'?'<span class="tag t-vip">VIP</span>':''; }
  // 재방문 신호(목록·격자 인라인 표기). 매출(VIP)은 목록에 안 띄움 — 상세 전용.
  function sigInfo(c){ var s=c.revisit_state;
    if(s==='overdue') return {label:'이탈 위험', color:'var(--rose)'};
    if(s==='due') return {label:'재방문 도래', color:'var(--gold)'};
    if(s==='new') return {label:'신규', color:'var(--sage)'};
    return null; }
  function sigRing(c){ var s=c.revisit_state; return s==='overdue'?' r-rose':(s==='new'?' r-sage':''); }

  var VIEWS={
    // 목록 — 시술·경과일·취향 + 재방문 신호 인라인
    list:function(cl){ return '<div class="card">'+cl.map(function(c){
      var v=c.loyalty_visits||0, dd=cdays(c), st=c.revisit_state, cyc=c.care_cycle_days, sg=sigInfo(c);
      var tags=(c.prefer||[]).slice(0,2).map(function(t){return '<span class="pill" style="font-size:10.5px;padding:2px 8px">'+esc(t)+'</span>';}).join(' ');
      var right;
      if(st==='overdue'||st==='due') right='<div class="sig" style="color:'+sg.color+'">'+sg.label+'</div><div class="st-rec">'+dd+'일째 · 평소 '+cyc+'일</div>';
      else if(st==='new') right='<div class="sig" style="color:'+sg.color+'">신규</div>'+(dd!=null?'<div class="st-rec">'+dd+'일 전</div>':'');
      else right='<div style="font-weight:800;color:var(--accent-d)">'+v+'회</div>'+(dd!=null?'<div class="st-rec">'+dd+'일 전</div>':'');
      return '<div class="li" data-client="'+esc(c.id)+'" style="align-items:flex-start"><div class="av'+sigRing(c)+'">'+av(c.name)+'</div>'+
        '<div class="bd"><div class="nm">'+esc(c.name)+' 님</div><div class="sub">'+esc(csvc(c))+' · '+v+'회</div>'+
        (tags?'<div style="margin-top:6px;display:flex;gap:5px;flex-wrap:wrap">'+tags+'</div>':'')+'</div>'+
        '<div class="rt">'+right+'</div></div>';
    }).join('')+'</div>'; },

    // 격자 — 2단 밀도 + 신호 표기
    grid:function(cl){ return '<div class="cv-grid">'+cl.map(function(c){
      var v=c.loyalty_visits||0, sg=sigInfo(c);
      var foot=sg?'<div style="margin-top:5px;font-size:10px;font-weight:800;color:'+sg.color+'">'+sg.label+'</div>'
        :((c.prefer&&c.prefer[0])?'<div style="margin-top:6px"><span class="pill" style="font-size:10px;padding:2px 7px">'+esc(c.prefer[0])+'</span></div>':'');
      return '<div class="cv-g" data-client="'+esc(c.id)+'"><div class="av'+sigRing(c)+'">'+av(c.name)+'</div><div class="gn">'+esc(c.name)+'</div><div class="gs">'+v+'회 · '+esc(csvc(c)||'')+'</div>'+foot+'</div>';
    }).join('')+'</div>'; },
  };

  function renderClients(){
    var box=document.getElementById('clientList');
    var all=DATA?(DATA.clients||[]):[];
    var cc=document.getElementById('clientCount');
    if(!all.length){ box.innerHTML=empty('👥','아직 등록된 고객이 없어요','단골 고객 정보를 정리해 드리면\n예약·생일·취향을 자동으로 챙겨드려요'); if(cc)cc.textContent=''; return; }
    var q=clientQuery.trim().toLowerCase();
    var cl=q? all.filter(function(c){
      return (c.name||'').toLowerCase().indexOf(q)>=0 || String(c.custno||'').indexOf(q)>=0
        || (c.prefer||[]).join(' ').toLowerCase().indexOf(q)>=0 || (c.memo||'').toLowerCase().indexOf(q)>=0;
    }) : all.slice();
    if(clientFocus){ cl=cl.filter(function(c){ return clientFocus==='vip'? c.tier==='vip' : c.revisit_state===clientFocus; }); }
    cl.sort(function(a,b){
      if(clientSortKey==='name') return (a.name||'').localeCompare(b.name||'','ko');
      if(clientSortKey==='recent') return (b.last_visit||'').localeCompare(a.last_visit||'');
      if(clientSortKey==='revenue') return (b.total_won||0)-(a.total_won||0);
      return (b.loyalty_visits||0)-(a.loyalty_visits||0);
    });
    if(cc) cc.textContent=q? (cl.length+'명 검색됨 / 전체 '+all.length) : (clientFocus? (focusLabel(clientFocus)+' '+cl.length+'명') : ('전체 '+all.length+'명'));
    var focusBar=clientFocus? '<button class="focus-pill" data-clearfocus="1">'+focusLabel(clientFocus)+' 필터 ✕</button>' : '';
    if(!cl.length){ box.innerHTML=focusBar+empty('🔎','해당 고객이 없어요','필터를 해제하거나 다른 조건으로 보세요'); return; }
    box.innerHTML=focusBar+(VIEWS[clientView]||VIEWS.list)(cl);
  }

  // 소개 관계 행(가족·동반은 별도 familyCard 가 담당)
  function relHtml(c){
    var parts=[];
    if(c.referred_by){
      parts.push('<span class="pill" data-client="'+esc(c.referred_by.id)+'" style="cursor:pointer">소개해주신 분 · '+esc(c.referred_by.name)+'님</span>');
    }
    if(c.referred&&c.referred.length){
      parts.push('<span class="pill" style="background:var(--sage-bg);color:var(--sage)">소개해준 고객 '+c.referred.length+'명 · '+c.referred.map(function(x){return esc(x.name)+'님';}).join(', ')+'</span>');
    }
    return parts.length? '<div class="r"><div class="k">소개</div><div class="pills">'+parts.join('')+'</div></div>' : '';
  }

  // 상세: 재방문 신호 카드(이탈위험·도래·신규일 때만)
  function signalCard(c){
    var st=c.revisit_state; if(st!=='overdue'&&st!=='due'&&st!=='new') return '';
    var sg=sigInfo(c), t=parseD(META.today)||new Date(), why, kind=null;
    if(st==='overdue'){ kind='atrisk'; why=(csvc(c)||'시술')+' · '+c.days_since+'일째 안 오심 (평소 '+c.care_cycle_days+'일 주기)'; }
    else if(st==='due'){ kind='revisit'; why=(csvc(c)||'시술')+' 리터치 시기 · '+c.days_since+'일째 (평소 '+c.care_cycle_days+'일)'; }
    else { why='최근 첫 방문'+(c.days_since!=null?(' · '+c.days_since+'일 전'):'')+' — 재방문 케어로 단골 전환 기회'; }
    var draft=kind?draftFor(kind,c,t):'';
    return '<div class="care reveal" style="border-left:3px solid '+sg.color+'">'+
      '<div class="hd"><span class="tag" style="background:'+sg.color+';color:#fff">'+sg.label+'</span><span class="nm" style="font-size:12.5px;color:var(--muted)">재방문 신호</span></div>'+
      '<div class="why">'+esc(why)+'</div>'+
      (draft?'<div class="draft"><div class="lab">추천 문구 (직접 보내기)</div>'+esc(draft)+'</div><div class="row2" style="margin-top:8px"><button class="btn" data-toast="'+esc(c.name)+'님 — 카톡으로 직접 보내기">카톡으로 직접</button></div>':'')+
      '</div>';
  }

  // 상세: 가족·동반 연결 카드(가족류 태그 또는 연결된 관계가 있을 때)
  var FAMILY_RE=/가족|동반|모녀|부부|남편|아내|자녀|형제|쌍둥이|아이|반려|부모|딸|아들|언니|누나|오빠/;
  function familyCard(c){
    var hasTag=(c.prefer||[]).some(function(t){return FAMILY_RE.test(t);});
    var rels=c.relations||[];
    if(!hasTag && !rels.length) return '';
    var body=rels.length
      ? '<div class="pills">'+rels.map(function(r){ return '<span class="pill" data-client="'+esc(r.id)+'" style="cursor:pointer;background:var(--sage-bg);color:var(--sage)">'+esc(r.name)+'님 · '+esc(r.type||'가족')+'</span>'; }).join('')+'</div>'
      : '<div style="font-size:12.5px;color:var(--muted)">함께 오시는 가족은 \'수정\'에서 연결할 수 있어요</div>';
    return '<div class="card reveal" style="padding:13px 15px"><div class="ch" style="padding:0 0 8px">👨‍👩‍👧 가족 · 동반</div>'+body+'</div>';
  }

  // ── render: client detail ──

    var hist=(c.history||[]).map(function(h){
      return '<div class="li" style="cursor:default"><div class="bd"><div class="nm" style="font-weight:600">'+esc(h.service||'')+'</div>'+(h.notes?'<div class="sub">'+esc(h.notes)+'</div>':'')+'</div><div class="rt">'+esc(h.date||'')+'</div></div>';
    }).join('')||('<div style="padding:14px 15px;color:var(--muted);font-size:13px">시술 이력이 아직 없어요</div>');
    var prefer=(c.prefer||[]).map(function(p){return '<span class="pill">'+esc(p)+'</span>';}).join('');
    box.innerHTML=
      '<div class="hello reveal" style="display:flex;align-items:center;gap:13px;margin-bottom:8px">'+
        '<div class="av" style="width:54px;height:54px;font-size:22px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent)">'+av(c.name)+'</div>'+
        '<div style="flex:1"><h2 style="margin:0;font-size:20px">'+esc(c.name)+' 님'+(c.tier==='vip'?' <span class="tag t-vip">VIP</span>':'')+(c.custno?'<span style="font-size:11px;font-weight:600;color:var(--muted);margin-left:7px">#'+esc(c.custno)+'</span>':'')+'</h2><div class="s" style="color:var(--muted);font-size:13px">'+(c.loyalty_visits||0)+'회 방문'+(c.total_won?(' · 누적 '+wonShort(c.total_won)+'원'):'')+(c.first_visit?(' · 첫 방문 '+esc(c.first_visit)):'')+'</div></div>'+
        '<button class="btn ghost" data-edit-client="'+esc(c.id)+'" style="flex:0 0 auto;width:auto;padding:8px 14px;">수정</button>'+
      '</div>'+
      signalCard(c)+
      (c.booking?'<div class="care reveal"><div class="why" style="margin:0 0 4px">다가오는 예약</div><div style="font-weight:800">'+esc(c.booking.date||'')+' '+esc(c.booking.time||'')+' · '+esc(c.booking.service||'')+'</div></div>':'')+
      (c.crosssell?'<div class="card reveal" style="padding:13px 15px;border:1px solid var(--sage);background:#F3F7F1"><div class="ch" style="padding:0 0 5px;color:var(--sage)">💡 추천 · '+esc(c.crosssell.label)+'</div><div style="font-size:13px;line-height:1.6;color:var(--ink)">'+esc(c.crosssell.copy)+'</div><div class="row2" style="margin-top:9px"><button class="btn" data-toast="'+esc(c.name)+'님 — 카톡으로 직접 보내기" style="flex:1">카톡으로 직접</button></div></div>':'')+
      (c.memo?'<div class="card reveal" style="padding:12px 15px"><div class="ch" style="padding:0 0 5px">상담 메모</div><div style="font-size:13.5px;line-height:1.6;color:var(--ink);white-space:pre-wrap">'+esc(c.memo)+'</div></div>':'')+
      '<div class="kv reveal">'+
        (prefer?'<div class="r"><div class="k">취향</div><div class="pills">'+prefer+'</div></div>':'')+
        (c.last_visit?'<div class="r"><div class="k">마지막 방문</div><div class="v">'+esc(c.last_visit)+'</div></div>':'')+
        relHtml(c)+
      '</div>'+
      familyCard(c)+
      '<div class="sec-h" style="margin-top:16px">시술 이력'+(nHist?' <span style="color:var(--muted);font-weight:500;font-size:12px">'+nHist+'건</span>':'')+'</div>'+
      '<div class="card hist'+(nHist>3?' hist-collapsed':'')+'" id="histCard">'+hist+'</div>'+
      (nHist>3?'<button class="btn ghost" data-histtoggle="'+nHist+'" style="margin:8px 0 18px">전체 '+nHist+'건 보기 ▾</button>':'')+
      ((c.aftercare&&c.aftercare.length)?(
        '<div class="card reveal" style="padding:13px 15px"><div class="ch" style="padding:0 0 6px">시술 후 관리 안내 (보내기 좋아요)</div>'+
        '<ul style="margin:0;padding-left:18px;font-size:13px;color:var(--ink);line-height:1.7">'+
        c.aftercare.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>'+
        '<button class="btn ghost" data-toast="관리 안내를 카톡으로 보내기" style="margin-top:10px">관리 안내 보내기</button></div>'
      ):'')+
      '<button class="btn" data-toast="'+esc(c.name)+'님 — 카톡으로 직접 보내기" style="margin-top:4px">추천 문구 보내기</button>';
    go('s-client');
  }

  // ── render: exposure ──
  function renderExposure(){
    var box=document.getElementById('exposureBody');
    var ex=DATA&&DATA.exposure;
    var qs=(ex&&(ex.queries||ex.questions))||[];
    if(!ex||!qs.length){
      box.innerHTML=empty('📈','노출 진단이 아직 없어요','손님이 AI·검색에 물어볼 질문으로\n발견 점수를 진단해 여기에 보여드려요');
      return;
    }
    var sc=ex.score!=null?ex.score:0;
    var hist=(ex.history||[]).slice(-8);
    var hmax=Math.max.apply(null,hist.map(function(h){return h.score;}).concat([1,sc]));
    var prev=hist.length>1?hist[hist.length-2].score:null;
    var delta=prev!=null?(sc-prev):null;
    var dtxt=delta==null?'':(delta>0?('▲ '+delta):(delta<0?('▼ '+Math.abs(delta)):'–'));
    var spark=hist.map(function(h){var ph=Math.round((h.score/hmax)*42)+4;return '<div class="sb" data-h="'+ph+'" style="height:4px" title="'+esc(h.date)+' · '+h.score+'"></div>';}).join('');

    // 발견 점수 + 추세
    var head='<div class="card reveal" style="padding:16px 16px 14px"><div class="exp-score">'+
      '<div><div class="big">'+sc+'</div><div class="lab">발견 점수 / 100</div>'+
      (dtxt?('<div class="exp-delta" style="color:'+(delta>=0?'var(--sage)':'var(--rose)')+';margin-top:4px">'+dtxt+' vs 지난 측정</div>'):'')+'</div>'+
      '<div style="margin-left:auto;text-align:right"><div class="exp-spark">'+spark+'</div><div style="font-size:10px;color:var(--muted);margin-top:4px">개선 추세</div></div>'+
      '</div></div>';

    // 이번 주 할 일
    var acts=(ex.actions||[]);
    var actHtml=acts.length? '<div class="sec-h" style="margin-top:14px">이번 주 할 일</div>'+acts.map(function(a){
      return '<div class="exp-act reveal"><div class="t">'+esc(a.title)+'</div>'+(a.why?'<div class="w">'+esc(a.why)+'</div>':'')+
        (a.effort?'<div class="e">⏱ '+esc(a.effort)+'</div>':'')+'</div>';
    }).join(''):'';

    // 이름 검색 베이스라인(존재 확인)
    var nb=ex.name_baseline||{};
    var baseHtml=(nb.name_rank!=null||nb.name_found!=null)? '<div class="exp-act reveal" style="border-left-color:var(--sage)"><div class="t" style="font-size:13px">'+
      (nb.name_rank? '✓ 이름 검색 시 '+nb.name_rank+'위 — 네이버에 등록돼 있어요':'이름 검색에도 안 보여요 — 플레이스 등록·정보 점검 필요')+'</div>'+
      '<div class="w">'+(nb.name_rank? '존재는 하는데, 아래 발견 키워드엔 안 떠요 → 키워드·리뷰 최적화가 핵심':'등록/정보부터 확인하세요')+'</div></div>':'';

    // 네이버 발견 키워드(깨끗한 지역×시술) + 우리 순위 + 경쟁사 + '이렇게 입력하세요'
    var nqs=ex.naver_queries||[];
    var kpMap={}; (ex.keyword_plan||[]).forEach(function(p){kpMap[p.keyword]=p;});
    var myStyles=(ex.place&&ex.place.styles)||[];
    var myS=myStyles.length? '<div style="font-size:11px;color:var(--muted);margin:2px 2px 8px">네이버가 보는 우리 인기스타일: <b>'+myStyles.map(esc).join(', ')+'</b></div>':'';
    var nvHtml=nqs.length? '<div class="sec-h" style="margin-top:14px">네이버 발견 키워드 · 이렇게 입력하세요</div>'+myS+'<div class="card">'+nqs.map(function(x){
      var tag=(x.naver_found)? '<span class="exp-t nv">우리 '+(x.naver_rank?(x.naver_rank+'위'):'노출')+'</span>':'<span class="exp-t off">미노출</span>';
      var top=(x.top&&x.top.length&&!x.naver_found)? '<div style="font-size:11px;color:var(--muted);margin-top:4px">상위: '+x.top.slice(0,3).map(esc).join(', ')+'</div>':'';
      var pp=kpMap[x.q];
      var adv=(pp&&!x.naver_found)? '<div style="font-size:11.5px;color:var(--accent-d);margin-top:5px;line-height:1.5">→ '+esc(pp.advice)+'</div>':'';
      return '<div class="li" style="cursor:default;display:block"><div class="exp-row"><div class="exp-q">'+esc(x.q)+top+adv+'</div><div class="exp-tags">'+tag+'</div></div></div>';
    }).join('')+'</div>':'';

    // AI 흔적 처방 — AI 가 인용하게 만드는 이번 주 콘텐츠(언급 적을 때만)
    var aip=ex.ai_plan||{}, aiPlanHtml='';
    if(aip.actions && aip.actions.length){
      aiPlanHtml='<div class="exp-act" style="border-left-color:var(--accent);margin:9px 0 0"><div class="t">AI가 「'+esc(aip.push_keyword||'')+'」로 살롱톤을 인용하게 만들기</div>'+
        '<div class="w" style="margin-bottom:6px">지금 AI 언급 '+(aip.ai_mentions||0)+'/'+(aip.ai_total||0)+' — 웹에 인용할 글이 적어서예요</div>'+
        aip.actions.map(function(a){return '<div style="font-size:12px;margin-top:5px;line-height:1.5">· '+esc(a.title)+' <span style="color:var(--muted)">('+esc(a.effort)+')</span></div>';}).join('')+'</div>';
    }
    // AI 발견(대화체 질문) — 샵·디자이너 분리
    var aiSalon=qs.filter(function(q){return q.ai_salon;}).length, aiDes=qs.filter(function(q){return q.ai_designer;}).length;
    var aiSum=qs.length? '<div style="font-size:11.5px;color:var(--muted);margin:0 2px 7px">샵(살롱톤) '+aiSalon+'/'+qs.length+' · 디자이너 '+aiDes+'/'+qs.length+' 언급</div>':'';
    var qHtml='<div class="sec-h" style="margin-top:14px">손님이 AI에 이렇게 물으면</div>'+aiSum+aiPlanHtml+'<div class="card" style="margin-top:9px">'+qs.map(function(q){
      var shopT=q.ai_salon? '<span class="exp-t on">샵</span>':'<span class="exp-t off">샵 ✕</span>';
      var desT=q.ai_designer? '<span class="exp-t on">디자이너</span>':'<span class="exp-t off">디자이너 ✕</span>';
      var said=q.ai_said? '<div style="font-size:11.5px;color:var(--sage);margin-top:5px">“'+esc(q.ai_said)+'”</div>':'';
      var comp=(q.ai_competitors&&q.ai_competitors.length&&!q.ai_mentioned)? '<div style="font-size:11px;color:var(--muted);margin-top:4px">대신 등장: '+q.ai_competitors.slice(0,3).map(esc).join(', ')+'</div>':'';
      return '<div class="li" style="cursor:default;display:block"><div class="exp-row"><div class="exp-q">'+esc(q.q)+said+comp+'</div><div class="exp-tags">'+shopT+desT+'</div></div></div>';
    }).join('')+'</div>';
    qHtml=baseHtml+nvHtml+qHtml;

    // 리뷰 비교 (우리 vs 주변 경쟁) + 따라잡기
    var pl=ex.place||{}, placeHtml='';
    if(pl.measured && pl.competitors && pl.competitors.length){
      var allr=[pl.reviews||0].concat(pl.competitors.map(function(c){return c.reviews||0;}));
      var mx=Math.max.apply(null,allr.concat([1]));
      var bar=function(nm,rev,us){ var w=Math.round((rev/mx)*100);
        return '<div style="display:flex;align-items:center;gap:8px;margin:5px 0"><div style="flex:1;font-size:12px;'+(us?'font-weight:800;color:var(--accent-d)':'color:var(--muted)')+'">'+esc(nm)+'</div>'+
          '<div style="width:110px;height:8px;background:var(--soft);border-radius:5px;overflow:hidden"><div style="height:100%;width:'+w+'%;background:'+(us?'var(--sage)':'var(--line)')+'"></div></div>'+
          '<div style="font-size:11.5px;font-weight:700;width:36px;text-align:right">'+rev+'</div></div>'; };
      var rows=bar('우리 ('+((ex.name_baseline||{}).name_query?'살롱톤':'우리')+')',pl.reviews||0,true)+pl.competitors.slice(0,5).map(function(c){return bar(c.name,c.reviews||0,false);}).join('');
      var catchH=(pl.catch_up_reviews>0)?
        '<div class="exp-act" style="border-left-color:var(--gold);margin-top:9px"><div class="t">리뷰 '+pl.catch_up_reviews+'건만 더 받으면 주변 중위권 따라잡아요</div><div class="w">우리 '+(pl.reviews||0)+'건 · 경쟁 중위 '+(pl.comp_reviews_median||0)+'건</div></div>'
        : '<div class="exp-act reveal" style="border-left-color:var(--sage);margin-top:9px"><div class="t">✓ 리뷰는 주변 중위권 이상 ('+(pl.reviews||0)+'건'+(pl.rating?(' · ★'+pl.rating):'')+')</div><div class="w">리뷰는 충분해요 — 과제는 <b>발견 노출</b>(키워드)이에요</div></div>';
      placeHtml='<div class="sec-h" style="margin-top:14px">리뷰 비교 (우리 vs 주변)</div><div class="card" style="padding:13px 15px">'+rows+'</div>'+catchH;
      // 사진(썸네일) 비교 — 측정됐을 때만(네이버는 총계를 안 줘 썸네일 실측)
      if(pl.photos!=null){
        var pm=pl.comp_photos_median;
        var phMsg=(pm!=null && pl.photos<pm)
          ? '사진 더 올리면 좋아요 — 우리 '+pl.photos+'장 · 주변 중위 '+pm+'장'
          : '✓ 사진 노출 충분 (우리 '+pl.photos+'장'+(pm!=null?' · 주변 중위 '+pm+'장':'')+')';
        placeHtml+='<div class="exp-act reveal" style="border-left-color:'+((pm!=null&&pl.photos<pm)?'var(--gold)':'var(--sage)')+';margin-top:7px"><div class="t">'+phMsg+'</div><div class="w">플레이스 사진 탭 기준(썸네일 실측)</div></div>';
      }
    }
    // 측정 범위(정직성) — 무엇을 쟀고 무엇은 아직인지
    var md=ex.measured||{};
    var mline=function(on,t){return '<span class="exp-t '+(on?'on':'off')+'">'+(on?'✓ ':'— ')+t+'</span>';};
    var scope='<div style="display:flex;gap:5px;flex-wrap:wrap;margin:9px 2px 2px">'+
      mline(md.ai,'AI 발견')+mline(md.naver,'웹/네이버 발견')+mline(md.place,'플레이스 리뷰·사진')+mline(md.blog,'블로그 후기')+'</div>';

    // 하예원님께 — 이번 주 딱 하나(디자이너용 카드, 맨 위)
    var dc=ex.designer_card;
    var dcard=dc? '<div class="dcard reveal">'+
      '<div class="dc-h">하예원님께'+(ex.kakao?'<button id="kakaoCopy" class="dc-copy">카톡 복사</button>':'')+'</div>'+
      '<div class="dc-g">'+esc(dc.greeting)+'</div>'+
      (dc.good?'<div class="dc-good">✓ '+esc(dc.good)+'</div>':'')+
      '<div class="dc-ask">'+esc(dc.ask)+'</div>'+
      '<div class="dc-do">'+esc(dc.do)+'</div>'+
      '<div class="dc-f">'+esc(dc.footer)+'</div>'+
    '</div>' : '';

    box.innerHTML=dcard+head+scope+actHtml+placeHtml+qHtml+
      (ex.note?'<div style="font-size:10.5px;color:var(--muted);text-align:center;margin:12px 0 4px;line-height:1.5">'+esc(ex.note)+'</div>':'');
    setTimeout(function(){box.querySelectorAll('.exp-spark .sb').forEach(function(b){b.style.height=b.getAttribute('data-h')+'px';});},60);
    var cb=box.querySelector('#kakaoCopy');
    if(cb) cb.onclick=function(){
      var done=function(){cb.textContent='복사됨 ✓';setTimeout(function(){cb.textContent='카톡 복사';},1800);};
      try{ navigator.clipboard.writeText(ex.kakao).then(done,done); }catch(e){ done(); }
    };
  }

  // ── render: home 통계 요약 카드 ──
  function renderHomeStats(){
    var box=document.getElementById('homeStats');
    var s=DATA&&DATA.stats;
    if(!s||!s.total_visits){ box.innerHTML=''; return; }
    var delta=s.this_month-s.last_month;
    var dtxt=delta>0?('▲ '+delta):(delta<0?('▼ '+Math.abs(delta)):'–');
    box.innerHTML='<div class="card reveal" style="padding:14px 15px"><button class="mini-link" data-go="s-stats"><span style="font-family:var(--serif);text-transform:uppercase;letter-spacing:.5px">이번 달 요약</span><span>자세히 ›</span></button>'+

  // 방문 간격 중앙값 → 개인별 재방문 주기(일). 명시값(care_cycle_days) 우선, 없으면 이력에서 추정.
  function cycleOf(c){ if(+c.care_cycle_days) return +c.care_cycle_days;

  // 재방문 상태: overdue(이탈위험)·due(도래)·soon(곧)·new(첫방문케어)·ok

  // 업종별 카피는 빌드(build_app)가 주입한 DATA.config(=kb/copy.yaml) 단일 소스에서.

  function benefit(s){ s=s||''; var b=CONFIG.benefit||{}, rs=b.rules||[]; for(var i=0;i<rs.length;i++){ if((rs[i].keywords||[]).some(function(k){return s.indexOf(k)>=0;})) return rs[i].text; } return b.default||''; }

  // 받침 유무로 '이에요/예요' 선택, 인사말은 살롱·디자이너 데이터로 구성(업종 무관·자동)

      '<div class="fld"><label>빠른 태그 <span style="font-weight:600;color:var(--muted);font-size:11px">탭해서 추가 — 타이핑·녹음 없이</span></label>'+
        '<div class="qtags">'+(CONFIG.quick_tags||[]).map(function(t){ var on=(c.prefer||[]).indexOf(t)>=0; return '<span class="qtag'+(on?' on':'')+'" data-quicktag="'+esc(t)+'">'+esc(t)+'</span>'; }).join('')+'</div></div>'+
      '<div class="fld"><label>취향 · 메모 (직접 입력, 쉼표로 구분)</label><textarea id="f-prefer" placeholder="예: 밝은 톤, 손상 신경 씀">'+esc((c.prefer||[]).join(', '))+'</textarea></div>'+
      '<div class="fld"><label>상담 메모 <span style="font-weight:600;color:var(--muted);font-size:11px">(선택)</span><button class="mic" id="micMemo" type="button">🎤 음성</button></label>'+
        '<textarea id="f-memo" placeholder="타이핑하거나, 편하면 🎤 눌러 말해도 돼요">'+esc(c.memo||'')+'</textarea>'+
        '<div class="hint" id="micHint">내 폰에만 저장 · 손님은 모릅니다 · 손님을 녹음하는 게 아니라 내 메모예요</div></div>'+
      '<div class="fld2"><div class="fld"><label>재방문 주기 (일)</label><input id="f-cycle" type="number" inputmode="numeric" placeholder="예: 펌 90 / 새치 28" value="'+esc(c.care_cycle_days||'')+'"><div class="hint">넣으면 리터치 시기에 알림</div></div></div>'+
      '<div class="fld"><label>다음 예약</label><div class="fld2"><input id="f-bdate" type="text" inputmode="numeric" placeholder="YYYY-MM-DD" value="'+esc((c.booking||{}).date||'')+'"><input id="f-bsvc" type="text" placeholder="시술(선택)" value="'+esc((c.booking||{}).service||'')+'"></div></div>'+
      '<div class="fld"><label>시술 이력 <button class="del-x" id="addVisit" type="button" style="color:var(--accent);width:auto;padding:0 10px;height:28px;font-size:12px;font-weight:800;">+ 방문 추가</button></label><div id="visits">'+visits+'</div></div>'+
      (id?'<div class="fld"><label>가족 · 동반</label><div id="editFamList"></div><button class="btn ghost" id="editFamAdd" type="button" style="margin-top:2px">+ 가족 연결</button><div class="hint">함께 오시는 가족·지인을 연결하면 카르테에서 바로 이동돼요</div></div>':'')+
      '<div class="fld"><label>소개해주신 분</label><select id="f-refby">'+opt(c.referred_by)+'</select></div>'+
      '<button class="btn" id="saveClient" data-id="'+esc(id||'')+'" style="margin-top:6px;">저장</button>'+
      (id?'<button class="btn ghost" id="delClient" data-id="'+esc(id)+'" style="margin-top:8px;color:var(--rose);">이 고객 삭제</button>':'');
    go('s-edit');
    attachMic(document.getElementById('f-memo'), document.getElementById('micMemo'), document.getElementById('micHint'));
    if(id) renderEditFamily(id);
  }

  // 수정 폼 안의 가족·동반 목록(연결된 관계 + ✕ 해제). 연결은 즉시 양방향 반영.
  function renderEditFamily(id){
    var box=document.getElementById('editFamList'); if(!box) return;
    var rels=(findCust(id)||{}).relations||[];
    if(!rels.length){ box.innerHTML='<div style="font-size:12px;color:var(--muted);margin:2px 0 6px">아직 연결된 가족이 없어요</div>'; return; }
    box.innerHTML=rels.map(function(r){ var n=(findCust(r.to)||{}).name||r.to;
      return '<div class="famrow"><span class="pill" style="background:var(--sage-bg);color:var(--sage)">'+esc(n)+'님 · '+esc(r.type||'가족')+'</span><button class="del-x" data-famunlink="'+esc(id)+'|'+esc(r.to)+'" type="button">✕</button></div>';
    }).join('');
  }

  // ── 음성 입력(브라우저 내장 STT, 비용 0·기기에서) ──
  // iOS Safari 는 말 중간에 자동 종료됨 → 사용자가 멈추기 전엔 자동 재시작해 길게 받아쓴다.
  function attachMic(target, btn, hint){
    if(!btn||!target) return;
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){   // 버튼은 보이게 두고, 탭하면 왜 안 되는지 안내(타이핑·태그는 그대로)
      btn.onclick=function(){ if(hint) hint.textContent='이 환경에선 음성 입력이 안 돼요 — Safari로 열거나 홈 화면에 설치하면 됩니다. (타이핑·빠른 태그는 그대로 사용)'; };
      return;
    }
    var rec=new SR(); rec.lang='ko-KR'; rec.interimResults=true; rec.continuous=true;
    var want=false, base='';
    function begin(){ base=target.value?target.value.replace(/\s+$/,'')+' ':''; try{ rec.start(); }catch(e){} }
    btn.onclick=function(){ if(want){ want=false; rec.stop(); return; } want=true; begin(); };
    rec.onstart=function(){ btn.classList.add('rec'); btn.textContent='● 듣는 중 (탭하면 멈춤)'; if(hint) hint.textContent='말씀하세요…'; };
    rec.onend=function(){ if(want){ begin(); return; }  // 사용자가 멈추기 전엔 자동 이어듣기
      btn.classList.remove('rec'); btn.textContent='🎤 음성 입력'; if(hint) hint.textContent=''; };
    rec.onerror=function(e){ var er=e&&e.error; if(er==='not-allowed'||er==='service-not-allowed'){ want=false; if(hint) hint.textContent='마이크 권한을 허용해 주세요'; } };
    rec.onresult=function(e){ var t=''; for(var i=e.resultIndex;i<e.results.length;i++){ t+=e.results[i][0].transcript; } target.value=base+t; };
  }

  // 빠른 태그 탭 → 취향 칸에 토글(타이핑·녹음 없이 한 번에)
  function toggleQuickTag(el){
    var tag=el.getAttribute('data-quicktag');
    var ta=document.getElementById('f-prefer');
    var list=ta.value.split(',').map(function(s){return s.trim();}).filter(Boolean);
    var i=list.indexOf(tag);
    if(i>=0){ list.splice(i,1); el.classList.remove('on'); } else { list.push(tag); el.classList.add('on'); }
    ta.value=list.join(', ');
  }

  function collectForm(){
    var get=function(id){var e=document.getElementById(id);return e?e.value.trim():'';};
    var visits=[]; document.querySelectorAll('#visits .visit-row').forEach(function(row){
      var dt=row.querySelector('[data-v="date"]').value.trim(), sv=row.querySelector('[data-v="service"]').value.trim();
      if(dt||sv) visits.push({date:dt,service:sv});
    });
    var obj={ name:get('f-name'), birthday:get('f-bday'), memo:get('f-memo'), prefer:get('f-prefer').split(',').map(function(s){return s.trim();}).filter(Boolean), history:visits };
    var loyal=get('f-loyal'); if(loyal) obj.loyalty_visits=+loyal;
    var cyc=get('f-cycle'); if(cyc) obj.care_cycle_days=+cyc;
    var bdate=get('f-bdate'); if(bdate) obj.booking={date:bdate, service:get('f-bsvc')};
    var refby=get('f-refby'); if(refby) obj.referred_by=refby;
    // 가족(relations)은 수정 폼에서 즉시 양방향 반영되므로 여기서 다루지 않음(KEEP_FIELDS로 보존)
    return obj;
  }
  // 폼에 없는 시스템 관리 필드 — 수정 저장 시 보존(없으면 매출·등급·검색이 깨짐)
  var KEEP_FIELDS=['custno','first_visit','total_won','contact','relations'];
  function saveClient(id){
    var obj=collectForm(); if(!obj.name){ toast('이름을 입력해 주세요'); return; }
    if(id){ for(var i=0;i<CUSTS.length;i++){ if(CUSTS[i].id===id){ var old=CUSTS[i]||{}; obj.id=id;
      KEEP_FIELDS.forEach(function(k){ if(old[k]!=null && obj[k]==null) obj[k]=old[k]; });   // 폼이 못 건드리는 필드 이월
      CUSTS[i]=obj; break; } } }
    else { obj.id=uid(); CUSTS.push(obj); }
    lsSave(); refresh(); back(); toast('저장했어요');
  }
  function delClient(id){ CUSTS=CUSTS.filter(function(c){return c.id!==id;}); lsSave(); refresh(); stack=['s-clients']; show('s-clients','back'); toast('삭제했어요'); }

  // ── 가족·동반 연결 (수동, 수정 폼 안에서) ──
  var famTargetId=null, famReturnTo='edit', famType='가족';
  var REL_TYPES=['가족','자녀','부모','배우자','형제','지인'];
  var REL_INVERSE={가족:'가족',자녀:'부모',부모:'자녀',배우자:'배우자',형제:'형제',지인:'지인'};  // 상대 카르테엔 역관계
  function findCust(id){ for(var i=0;i<CUSTS.length;i++){ if(CUSTS[i].id===id) return CUSTS[i]; } return null; }
  function paintFamTypes(){ var t=document.getElementById('famTypes'); if(!t) return;
    [].forEach.call(t.querySelectorAll('[data-famtype]'),function(b){ b.classList.toggle('on', b.getAttribute('data-famtype')===famType); }); }
  function openFamPicker(id, ctx){ famTargetId=id; famReturnTo=ctx||'edit'; famType='가족'; paintFamTypes();
    var s=document.getElementById('famSearch'); s.value=''; renderFamResults(''); document.getElementById('famPicker').style.display='flex'; setTimeout(function(){s.focus();},50); }
  function closeFamPicker(){ document.getElementById('famPicker').style.display='none'; famTargetId=null; }
  function renderFamResults(q){
    q=(q||'').trim().toLowerCase();
    var self=findCust(famTargetId)||{};
    var linked={}; (self.relations||[]).forEach(function(r){linked[r.to]=1;});
    var list=CUSTS.filter(function(c){ return c.id!==famTargetId && !linked[c.id] && (!q || (c.name||'').toLowerCase().indexOf(q)>=0); })
      .sort(function(a,b){return (a.name||'').localeCompare(b.name||'','ko');}).slice(0,40);
    var box=document.getElementById('famResults');
    if(!list.length){ box.innerHTML='<div style="padding:18px;text-align:center;color:var(--muted);font-size:13px">'+(q?'검색 결과가 없어요':'고객이 없어요')+'</div>'; return; }
    box.innerHTML=list.map(function(c){
      return '<div class="li" data-fampick="'+esc(c.id)+'" style="cursor:pointer"><div class="av" style="width:32px;height:32px;font-size:13px">'+av(c.name)+'</div><div class="bd"><div class="nm" style="font-size:14px">'+esc(c.name)+' 님</div><div class="sub">'+(c.loyalty_visits||(c.history||[]).length||0)+'회</div></div><div class="rt" style="color:var(--sage);font-weight:800">+ 연결</div></div>';
    }).join('');
  }
  function linkFamily(aId,bId,type){
    var a=findCust(aId), b=findCust(bId); if(!a||!b) return;
    type=type||'가족';
    function add(x,toId,ty){ x.relations=x.relations||[]; var ex=x.relations.filter(function(r){return r.to===toId;})[0]; if(ex){ ex.type=ty; } else { x.relations.push({to:toId,type:ty}); } }
    add(a,bId,type); add(b,aId,REL_INVERSE[type]||type); lsSave(); refresh();
  }
  function unlinkFamily(aId,bId){
    [ [aId,bId],[bId,aId] ].forEach(function(p){ var x=findCust(p[0]); if(x&&x.relations) x.relations=x.relations.filter(function(r){return r.to!==p[1];}); });
    lsSave(); refresh();
  }

  // ── 내보내기 / 가져오기 (백업·기기 이동) ──
  function exportData(){
    var blob=new Blob([JSON.stringify(CUSTS,null,2)],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=SLUG+'-customers.json'; a.click(); toast('백업 파일을 내려받았어요');
  }
  function importData(file){
    var r=new FileReader(); r.onload=function(){ try{ var arr=JSON.parse(r.result); if(Array.isArray(arr)){ CUSTS=arr; lsSave(); refresh(); toast('가져왔어요 ('+arr.length+'명)'); } else toast('형식이 올바르지 않아요'); }catch(e){ toast('읽기 실패'); } }; r.readAsText(file);
  }

  // ── 이벤트 배선 ──
  document.body.addEventListener('click', function(e){
    var qt=e.target.closest('[data-quicktag]'); if(qt){ toggleQuickTag(qt); return; }
    if(e.target.closest('#addClientBtn')){ editClient(null); return; }
    if(e.target.closest('#exportBtn')){ exportData(); return; }
    if(e.target.closest('#importBtn')){ document.getElementById('importFile').click(); return; }
    if(e.target.closest('#addVisit')){ var v=document.getElementById('visits'); var i=v.children.length; v.insertAdjacentHTML('beforeend','<div class="visit-row"><input data-v="date" data-i="'+i+'" type="text" inputmode="numeric" placeholder="YYYY-MM-DD"><input data-v="service" data-i="'+i+'" type="text" placeholder="시술명"><button class="del-x" data-delv="'+i+'" type="button">✕</button></div>'); return; }
    var dv=e.target.closest('[data-delv]'); if(dv){ dv.parentNode.remove(); return; }
    var sv=e.target.closest('#saveClient'); if(sv){ saveClient(sv.getAttribute('data-id')||null); return; }
    var dc=e.target.closest('#delClient'); if(dc){ delClient(dc.getAttribute('data-id')); return; }
    var ed=e.target.closest('[data-edit-client]'); if(ed){ editClient(ed.getAttribute('data-edit-client')); return; }
    var ht=e.target.closest('[data-histtoggle]'); if(ht){ var hc=document.getElementById('histCard'); if(hc){ var col=hc.classList.toggle('hist-collapsed'); ht.textContent= col? ('전체 '+ht.getAttribute('data-histtoggle')+'건 보기 ▾') : '접기 ▴'; } return; }
    if(e.target.closest('#editFamAdd')){ var eb=e.target.closest('#editFamAdd'); openFamPicker(document.getElementById('saveClient').getAttribute('data-id'), 'edit'); return; }
    var ft=e.target.closest('[data-famtype]'); if(ft){ famType=ft.getAttribute('data-famtype'); paintFamTypes(); return; }
    var fu=e.target.closest('[data-famunlink]'); if(fu){ var pr=fu.getAttribute('data-famunlink').split('|'); unlinkFamily(pr[0],pr[1]); renderEditFamily(pr[0]); return; }
    var fp=e.target.closest('[data-fampick]'); if(fp){ var tgt=famTargetId, ret=famReturnTo; linkFamily(tgt, fp.getAttribute('data-fampick'), famType); closeFamPicker(); if(ret==='edit') renderEditFamily(tgt); else openClient(tgt); toast(famType+'(으)로 연결했어요'); return; }
    if(e.target.closest('#famClose')){ closeFamPicker(); return; }
    if(e.target.id==='famPicker'){ closeFamPicker(); return; }   // 바깥 영역 탭 → 닫기
  });
  document.getElementById('famSearch').addEventListener('input', function(e){ renderFamResults(e.target.value); });
  document.getElementById('importFile').addEventListener('change', function(e){ if(e.target.files[0]) importData(e.target.files[0]); e.target.value=''; });
  document.getElementById('clientSearch').addEventListener('input', function(e){ clientQuery=e.target.value; renderClients(); });
  document.getElementById('clientSort').addEventListener('change', function(e){ clientSortKey=e.target.value; renderClients(); });
  function paintClientViews(){ var sw=document.getElementById('clientViews'); if(!sw) return;
    [].forEach.call(sw.querySelectorAll('[data-view]'), function(b){ b.classList.toggle('on', b.getAttribute('data-view')===clientView); }); }
  (function(){
    var sw=document.getElementById('clientViews');
    paintClientViews();
    sw.addEventListener('click', function(e){
      var b=e.target.closest('[data-view]'); if(!b) return;
      clientView=b.getAttribute('data-view');
      try{ localStorage.setItem('crm_view', clientView); }catch(err){}
      clientFocus=null;                 // 뷰 직접 전환 시 홈에서 건 필터 해제
      paintClientViews(); renderClients();
    });
  })();

  // ── 부팅: 빌드 시드 또는 PREVIEW_DATA → 최초 1회 로컬에 적재, 이후 로컬 우선 ──
  // preview=true(미리보기 파일): 로컬 무시하고 번들 데이터를 항상 보여줌(이전 미리보기 잔여 데이터 방지)
  function boot(base, preview){
    // 미리보기는 데이터 기준일(snapshot)에 고정 → 주기 신호가 결정적으로 재현됨. 운영은 기기 오늘.
    META.today=(preview && base && base.today)? base.today : todayStr();
    if(base){ META.designer=base.designer||''; META.salon=base.salon||''; META.exposure=base.exposure||null; META.stats=base.stats||null;
      if(base.config){ CONFIG = base.config; } }     // 업종 카피 단일 소스 주입
    var local=preview?null:lsLoad();
    CUSTS = (local!=null)? local : ((base&&base.seed)? base.seed.slice() : []);
    if(!preview && local==null) lsSave();
    refresh();
  }
  (function start(){
    if(typeof PREVIEW_DATA!=='undefined'){ boot(PREVIEW_DATA, true); return; }
    var slug=new URLSearchParams(location.search).get('d');
    if(!slug){ boot(null); return; }
    fetch('./data/'+encodeURIComponent(slug)+'.json',{cache:'no-store'})
      .then(function(r){return r.ok?r.json():null;}).then(function(j){ boot(j); }).catch(function(){ boot(null); });
  })();

  renderTabs('s-home');
  syncBar('s-home');
})();
</script>
<script>
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }
</script>
