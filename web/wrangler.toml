# Cloudflare Pages(무료·대역폭/요청 무제한) — Next.js via @cloudflare/next-on-pages.
name = "mirrorball-app"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# 온디맨드 문구 다듬기용 무료 LLM(배포 후 Pages 프로젝트에 Workers AI 바인딩 'AI' 추가 시 활성).
# 바인딩이 없으면 /api/ai 는 템플릿으로 폴백(무료).
[ai]
binding = "AI"
