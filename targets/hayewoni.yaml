designer:
  name: "하예원"
  aliases: ["하예원 디자이너", "hayewoni", "예원쌤"]   # 인스타 핸들 포함
salon:
  name: "살롱톤"
  aliases: ["살롱톤 영등포", "포레나영등포 살롱톤"]
# 실제 위치(앞 역)가 primary. 첫 번째 역으로 이름검색·경쟁사·지도순위를 측정한다.
# 손님 반경: 영등포시장역(위치) + 인접 영등포구청역·신길역 + 생활권 여의도.
regions: ["영등포시장역", "영등포구청역", "신길역", "여의도"]
region: "영등포시장역"                         # 단일 region 만 읽는 코드 호환(=primary)
specialties: ["레이어드컷", "뿌리펌", "레이어드펌", "퍼스널이미지컨설팅"]
questions:                                    # 손님이 AI에 실제로 칠 법한 문장 (사람이 확정)
  - "영등포 레이어드컷 잘하는 미용실 추천해줘"
  - "영등포구청역 근처 뿌리펌 잘하는 디자이너 알려줘"
  - "영등포 레이어드펌 자연스럽게 잘하는 곳 어디야"
  - "여의도·영등포 쪽 단발 커트 잘하는 미용실 추천"
  - "퍼스널컬러랑 이미지컨설팅까지 봐주는 미용실 영등포에 있어?"
  - "얼굴형 보고 어울리는 머리 추천해주는 디자이너 영등포 근처로 알려줘"
  - "영등포 손상모도 펌 가능한 미용실 추천해줘"
  - "포레나영등포 상가 근처 미용실 어디가 괜찮아"
  - "영등포에서 뿌리 볼륨펌 잘하는 곳 찾아줘"
  - "30대 여성 인기 헤어디자이너 영등포구 추천해줘"
sampling: 2                                   # 질문×엔진당 반복 횟수 (비결정성 대응)
