# 골든 세트 — 카피 엔진 평가/루프용.
# 사용: 각 case 의 input 만으로 카피를 생성 → reference_output 과 페어와이즈 비교 + 루브릭 채점.
# - facts: 입력에 실제로 주어진 사실. 이것 외엔 지어내면 안 됨(E축·가드레일).
# - rag_principles: RAG 가 이 케이스에 주입할 검증된 실전 원칙(C축이 반영을 검증).
# - must_include: 자연스럽게 1~2회 들어가야 할 SEO 앵커.
# - must_not_claim: 입력에 없어 등장하면 환각(가드레일 fail).
# - reference_output: 노하우 보유자가 쓴 '5점 목표' 카피.

cases:
  - id: balayage_gangnam_damage
    notes: "뿌리 자람 + 손상 걱정 고객. 발레아주 시그니처. 재방문 주기·상담 전환 노하우."
    input:
      region: "강남역"
      salon: "살롱드헤어 강남점"
      designer: "민지"
      service: "발레아주"
      keywords: ["발레아주", "뿌리 자연스러움", "손상 최소화"]
      facts:
        - "열·약산성 손상 최소화 펌제 사용"
        - "4주 뒤에도 뿌리 경계가 도드라지지 않음"
        - "前 청담 컬러 전문 살롱 5년"
    rag_principles:
      - "재방문 시점을 카피에 각인(자주 안 와도 됨 → 신뢰 + 자연 재방문)"
      - "첫 방문 부담을 '색 상담만'으로 낮춰 전환 앵커로 사용"
    must_include: ["강남", "발레아주"]
    must_not_claim: ["연예인", "1위", "수상", "10년"]
    reference_output: |
      강남역에서 뿌리가 자라도 티 안 나는 발레아주, 찾고 계셨나요?
      염색할 때마다 머릿결이 상할까 망설이셨다면 — 손상을 최소화한 펌제로
      뿌리부터 끝까지 자연스럽게 흐르는 그라데이션을 만들어 드려요.
      4주가 지나도 뿌리 경계가 도드라지지 않아, 자주 안 오셔도 괜찮습니다.
      청담에서 5년간 컬러만 다뤄온 손끝으로 원장님 모발에 맞는 톤을 함께 찾을게요.
      처음이시면 색 상담만 받아보셔도 좋아요 — 강남역 살롱드헤어에서 기다릴게요.

  - id: digitalperm_damaged_firstvisit
    notes: "곱슬·손상모 + 첫 방문 고객. 정직한 거절로 신뢰, 재방문 시점 각인."
    input:
      region: "강남역"
      salon: "살롱드헤어 강남점"
      designer: "민지"
      service: "디지털펌"
      keywords: ["디지털펌", "곱슬", "손상모", "첫 방문"]
      facts:
        - "결을 살리는 열펌, 유지력 5~6개월"
        - "손상이 심하면 시술 대신 상담·상태 진단 먼저"
      audience: "곱슬·탈색 손상으로 펌을 망설이는 첫 방문 고객"
    rag_principles:
      - "정직한 거절(무리한 시술 거절)로 신뢰를 사고, 그게 곧 단골 전환"
      - "유지 기간을 계절과 묶어 다음 방문 시점을 자연스럽게 각인"
      - "첫 방문은 '상담부터'로 진입장벽을 낮춤"
    must_include: ["디지털펌"]
    must_not_claim: ["100% 무손상", "탈모 치료", "영구"]
    reference_output: |
      곱슬이라 펌은 안 되는 줄 아셨죠?
      탈색으로 힘 빠진 모발도, 결만 살리는 디지털펌이면 매직 없이 단정해져요.
      아침마다 고데기 잡던 시간을 그대로 돌려드릴게요.
      다만 손상이 심한 날은 무리한 시술 대신 상태부터 봐드려요 — 오래 예쁜 게 더 중요하니까요.
      디지털펌은 5~6개월 가니까, 지금 하면 겨울 내내 편하게 보내실 수 있어요.
      첫 방문은 상담부터 가볍게, 강남역에서 만나요.

  - id: price_sensitive_cut_clinic
    notes: "가격 민감 고객. 투명 가격·불필요 시술 거절·묶음 앵커 노하우(B·C 스트레스)."
    input:
      region: "강남역"
      salon: "살롱드헤어 강남점"
      designer: "민지"
      service: "커트 + 손상모 클리닉"
      keywords: ["강남 커트", "가성비", "손상모 클리닉"]
      facts:
        - "커트 3만원, 손상모 클리닉 5만원"
        - "커트+클리닉 묶음 시 1만원 할인"
        - "손상 진단 후 필요한 시술만 권함"
      audience: "가격이 부담돼 미용실을 자주 못 가는 고객"
    rag_principles:
      - "가격을 숨기지 않고 먼저 투명하게 제시해 신뢰를 산다"
      - "필요 없는 시술은 권하지 않는다고 명시해 가성비 신뢰를 만든다"
      - "묶음(앵커)으로 객단가는 올리되 할인 명분을 제공"
    must_include: ["강남", "커트"]
    must_not_claim: ["반값", "최저가", "무료"]
    reference_output: |
      강남역에서 가격 부담 없이 머릿결까지 챙기고 싶으셨다면.
      커트는 3만원, 손상이 있으시면 클리닉 5만원 — 두 개를 함께 하시면 1만원 빼드려요.
      가격을 미리 솔직하게 알려드리는 게 마음 편하시잖아요.
      손상이 심하지 않으면 클리닉도 굳이 권하지 않아요. 필요한 것만 해야 다음에도 또 오시니까요.
      오래 단정하게 가는 커트로 잡아드릴게요. 처음이면 상담부터 편하게 오세요.

  - id: male_cut_office
    notes: "남성 직장인 컷. 다른 보이스(D)·재현성/시간 노하우·남성 SEO."
    input:
      region: "강남역"
      salon: "살롱드헤어 강남점"
      designer: "민지"
      service: "남성 커트 / 다운펌"
      keywords: ["강남 남성 커트", "다운펌", "직장인"]
      facts:
        - "남성 커트 2만 5천원, 다운펌 4만원"
        - "점심시간 30분 컷 가능"
        - "뻗치는 옆머리·뜨는 가르마 교정"
      audience: "스타일보다 단정함·빠름·재현성을 원하는 남성 직장인"
    rag_principles:
      - "남성 고객은 빠름·단정·재현성을 중시 → 시간과 재현성을 약속한다"
      - "다운펌으로 아침 손질 시간을 줄여주는 가치를 강조"
    must_include: ["강남", "남성 커트"]
    must_not_claim: ["여성", "연예인", "1위"]
    reference_output: |
      강남역 직장인이라면, 점심시간 30분이면 충분해요.
      옆머리가 뻗치거나 가르마가 자꾸 뜨는 분 — 두상에 맞춰 단정하게 정리하고,
      원하시면 다운펌으로 아침마다 손대는 시간을 없애드려요.
      다음에 오셔도 같은 라인으로 재현되게 잡아드리니, 매번 설명 안 하셔도 됩니다.
      남성 커트 2만 5천, 다운펌 4만. 점심 약속처럼 가볍게 들르세요.

  - id: perm_redo_anxiety
    notes: "펌 빨리 풀린 실패 경험 고객. 원인 짚기·정직한 거절·과장금지(B·C·E)."
    input:
      region: "강남역"
      salon: "살롱드헤어 강남점"
      designer: "민지"
      service: "디지털펌 (재시술)"
      keywords: ["강남 디지털펌", "펌 풀림", "재시술"]
      facts:
        - "펌 풀린 모발 무료 점검"
        - "상태가 안 좋으면 시술 대신 다음 시기 안내"
        - "열펌 유지 5~6개월"
      audience: "다른 곳에서 펌이 빨리 풀려 실망한 경험이 있는 고객"
    rag_principles:
      - "과거 실패를 탓하지 않고 원인(모발 상태·시기)을 짚어 신뢰를 만든다"
      - "무리한 재시술을 거절하는 것이 장기 신뢰로 이어진다"
      - "유지 기간은 명확히 약속하되 '절대' 같은 보장 과장은 하지 않는다"
    must_include: ["강남", "디지털펌"]
    must_not_claim: ["100%", "영구", "절대 안 풀림"]
    reference_output: |
      펌이 너무 빨리 풀려서 속상하셨던 적 있으세요?
      대부분은 솜씨보다 그날 모발 상태나 시기 때문이에요. 강남역에서 먼저 모발을 무료로 봐드리고,
      지금 디지털펌을 해도 괜찮은지부터 정직하게 말씀드릴게요.
      상태가 안 좋은 날엔 무리하게 다시 하지 않고 다음 시기를 안내해요 — 또 풀리면 서로 속상하니까요.
      괜찮은 모발이라면 열펌으로 5~6개월은 자연스럽게 가도록 잡아드려요.

  - id: junior_minimal_facts
    notes: "경력 짧은 신입 + 사실 거의 없음. 환각 유혹 스트레스(E 가드레일). 정성·솔직을 무기로."
    input:
      region: "강남역"
      salon: "살롱드헤어 강남점"
      designer: "수아"
      service: "여성 커트 / 드라이"
      keywords: ["강남 커트", "꼼꼼한 상담"]
      facts:
        - "올해 디자이너로 입문"
        - "커트·드라이 전문"
        - "충분한 상담 시간"
      audience: "합리적 가격에 꼼꼼히 봐주는 디자이너를 찾는 고객"
    rag_principles:
      - "경력이 짧을수록 '시간·정성'을 무기로 — 충분한 상담을 약속한다"
      - "모르는 건 솔직하게, 과장하지 않는 것이 오히려 신뢰가 된다"
    must_include: ["강남", "커트"]
    must_not_claim: ["경력 10년", "수상", "연예인", "원장", "전문가 1위"]
    reference_output: |
      강남역에서 서두르지 않고 꼼꼼히 봐주는 디자이너를 찾으셨다면.
      올해 디자이너로 시작한 만큼, 한 분 한 분 충분히 상담하고 원하시는 라인을 정확히 맞춰드리는 데
      시간을 아끼지 않아요.
      화려한 경력 대신, 오늘 손님 머리에 가장 잘 어울리는 커트와 드라이에 집중할게요.
      처음이시면 어떤 스타일이 어울릴지 상담부터 편하게 시작해요.

  # --- 템플릿 (새 케이스 추가 시 복사해서 채우기) ---
  - id: TEMPLATE_복사해서_사용
    notes: "이 케이스가 무엇을 스트레스 테스트하는지 (예: 가격 민감 고객 / 남성 컷 / 펌 재시술 불안)"
    input:
      region: "[지역]"
      salon: "[매장명]"
      designer: "[디자이너]"
      service: "[주력 시술]"
      keywords: ["[키워드1]", "[키워드2]"]
      facts:
        - "[입력에 실제로 주어진 사실 — 이것만 카피에 쓸 수 있음]"
      audience: "[타깃 고객 상황(선택)]"
    rag_principles:
      - "[이 케이스에 주입할 검증된 실전 원칙 — C축이 반영 여부를 채점]"
    must_include: ["[자연스럽게 들어가야 할 SEO 앵커]"]
    must_not_claim: ["[입력에 없어 등장하면 환각인 것들]"]
    reference_output: |
      [노하우 보유자가 직접 쓴 '5점 목표' 카피 — 주관 품질의 기준선]
