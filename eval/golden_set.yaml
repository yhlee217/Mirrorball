# 골든 세트 — 카피 엔진 평가/루프용.
# 사용: 각 case 의 input 만으로 카피를 생성 → reference_output 과 페어와이즈 비교 + 루브릭 채점.
# - facts: 입력에 실제로 주어진 사실. 이것 외엔 지어내면 안 됨(E축·가드레일).
# - rag_principles: RAG 가 이 케이스에 주입할 검증된 실전 원칙(C축이 반영을 검증).
# - must_include: 자연스럽게 1~2회 들어가야 할 SEO 앵커.
# - must_not_claim: 입력에 없어 등장하면 환각(가드레일 fail).
# - reference_output: 노하우 보유자가 쓴 '5점 목표' 카피.

cases:
  - id: balayage_gangnam_damage
    notes: "뿌리 자람 + 손상 걱정 고객. 발레아주 시그니처. 재방문 주기·상담 전환 노하우."
    input:
      region: "강남역"
      salon: "살롱드헤어 강남점"
      designer: "민지"
      service: "발레아주"
      keywords: ["발레아주", "뿌리 자연스러움", "손상 최소화"]
      facts:
        - "열·약산성 손상 최소화 펌제 사용"
        - "4주 뒤에도 뿌리 경계가 도드라지지 않음"
        - "前 청담 컬러 전문 살롱 5년"
    rag_principles:
      - "재방문 시점을 카피에 각인(자주 안 와도 됨 → 신뢰 + 자연 재방문)"
      - "첫 방문 부담을 '색 상담만'으로 낮춰 전환 앵커로 사용"
    must_include: ["강남", "발레아주"]
    must_not_claim: ["연예인", "1위", "수상", "10년"]
    reference_output: |
      강남역에서 뿌리가 자라도 티 안 나는 발레아주, 찾고 계셨나요?
      염색할 때마다 머릿결이 상할까 망설이셨다면 — 손상을 최소화한 펌제로
      뿌리부터 끝까지 자연스럽게 흐르는 그라데이션을 만들어 드려요.
      4주가 지나도 뿌리 경계가 도드라지지 않아, 자주 안 오셔도 괜찮습니다.
      청담에서 5년간 컬러만 다뤄온 손끝으로 원장님 모발에 맞는 톤을 함께 찾을게요.
      처음이시면 색 상담만 받아보셔도 좋아요 — 강남역 살롱드헤어에서 기다릴게요.

  - id: digitalperm_damaged_firstvisit
    notes: "곱슬·손상모 + 첫 방문 고객. 정직한 거절로 신뢰, 재방문 시점 각인."
    input:
      region: "강남역"
      salon: "살롱드헤어 강남점"
      designer: "민지"
      service: "디지털펌"
      keywords: ["디지털펌", "곱슬", "손상모", "첫 방문"]
      facts:
        - "결을 살리는 열펌, 유지력 5~6개월"
        - "손상이 심하면 시술 대신 상담·상태 진단 먼저"
      audience: "곱슬·탈색 손상으로 펌을 망설이는 첫 방문 고객"
    rag_principles:
      - "정직한 거절(무리한 시술 거절)로 신뢰를 사고, 그게 곧 단골 전환"
      - "유지 기간을 계절과 묶어 다음 방문 시점을 자연스럽게 각인"
      - "첫 방문은 '상담부터'로 진입장벽을 낮춤"
    must_include: ["디지털펌"]
    must_not_claim: ["100% 무손상", "탈모 치료", "영구"]
    reference_output: |
      곱슬이라 펌은 안 되는 줄 아셨죠?
      탈색으로 힘 빠진 모발도, 결만 살리는 디지털펌이면 매직 없이 단정해져요.
      아침마다 고데기 잡던 시간을 그대로 돌려드릴게요.
      다만 손상이 심한 날은 무리한 시술 대신 상태부터 봐드려요 — 오래 예쁜 게 더 중요하니까요.
      디지털펌은 5~6개월 가니까, 지금 하면 겨울 내내 편하게 보내실 수 있어요.
      첫 방문은 상담부터 가볍게, 강남역에서 만나요.

  # --- 템플릿 (새 케이스 추가 시 복사해서 채우기) ---
  - id: TEMPLATE_복사해서_사용
    notes: "이 케이스가 무엇을 스트레스 테스트하는지 (예: 가격 민감 고객 / 남성 컷 / 펌 재시술 불안)"
    input:
      region: "[지역]"
      salon: "[매장명]"
      designer: "[디자이너]"
      service: "[주력 시술]"
      keywords: ["[키워드1]", "[키워드2]"]
      facts:
        - "[입력에 실제로 주어진 사실 — 이것만 카피에 쓸 수 있음]"
      audience: "[타깃 고객 상황(선택)]"
    rag_principles:
      - "[이 케이스에 주입할 검증된 실전 원칙 — C축이 반영 여부를 채점]"
    must_include: ["[자연스럽게 들어가야 할 SEO 앵커]"]
    must_not_claim: ["[입력에 없어 등장하면 환각인 것들]"]
    reference_output: |
      [노하우 보유자가 직접 쓴 '5점 목표' 카피 — 주관 품질의 기준선]
