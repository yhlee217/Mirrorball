faq:
  - q: "레이어드컷은 어떤 분께 어울리나요?"
    a: "각진 얼굴형이나 계란형 얼굴에 가장 잘 어울립니다. 숱이 많아 관리가 힘든 분, 반대로 머리카락이 얇고 숱이 적어 볼륨이 고민인 분 모두에게 좋은 보완책이 됩니다."
  - q: "뿌리펌은 얼마나 유지되나요?"
    a: "보통 2개월 주기로 리터치를 권장합니다. 두상이 납작하거나 모발이 붙어 얼굴이 커 보일 때, 뿌리 볼륨을 살려 얼굴을 입체적이고 작아 보이게 만듭니다."
  - q: "레이어드펌과 일반 펌의 차이는 무엇인가요?"
    a: "레이어드펌(열펌)은 결이 매끄럽고 유지력이 5~6개월로 길어 자연스러운 흐름을 원하는 분께 맞습니다. 일반펌은 뿌리부터 탱글한 컬 디자인을 원할 때 적합합니다."
  - q: "손상모도 펌이 가능한가요?"
    a: "전용 펌제로 최소한의 손상으로 진행합니다. 다만 탈색 등으로 모발에 힘이 전혀 없는 경우엔 무리한 시술 대신 충분한 상담을 먼저 권해드립니다."
  - q: "퍼스널이미지컨설팅은 무엇인가요?"
    a: "유행 스타일 제안을 넘어 두상·목선·눈동자 색·얼굴형·체형·분위기까지 정밀하게 분석합니다. 어울리는 헤어스타일과 함께 나의 퍼스널 컬러에 대한 정확한 지식을 가져가실 수 있습니다."
  - q: "첫 방문인데 어떻게 가나요? 시술은 얼마나 걸리나요?"
    a: "영등포구청역에서 도보로 가까운 포레나영등포 상가동(살롱톤)에 있습니다. 소요 시간은 커트 1시간 내외, 염색 1시간 반 내외, 펌 2시간 반 내외입니다."
  - q: "예약은 어떻게 하나요?"
    a: "네이버 예약이 가장 편리합니다. 외국인 고객님 등은 카카오톡 채널 또는 인스타그램 DM으로도 가능합니다. 위치는 영등포구 국회대로50길 살롱톤입니다."
