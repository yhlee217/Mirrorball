# 핸드SOS 자동 동기화 매장 설정 (이 파일을 stores.yaml 로 복사해서 채우세요)
# secrets/ 는 .gitignore 됨 — 자격증명·셀렉터는 절대 커밋되지 않습니다.
#
# 셀렉터(login.fields / report.*)는 매장 로그인 화면을 한 번 보고 채웁니다.
#   python scripts/handsos_sync.py --only <slug> --headed --debug
# 로 창을 띄워 개발자도구로 실제 id/class 를 확인 → 아래 값에 넣으면 됩니다.
#
# 실패/요약 알림(선택): 슬랙/디스코드 등 incoming webhook URL.
notify_url: ""        # 예: https://hooks.slack.com/services/...

stores:
  - slug: hayewoni            # clients/{slug}/ 와 일치
    enabled: true
    staff: 하예원              # 이 담당자 행만 가져옴(여러 명 한 계정일 때). 전체면 비움.
    timeout_ms: 30000

    # ── 자격증명 (이 매장 계정) ──
    company_code: ""          # 회사코드
    username: ""              # 아이디
    password: ""              # 비밀번호

    # ── 로그인 화면 셀렉터 (핸드SOS 공통 — 이미 채워둠) ──
    login:
      url: "https://www.handsos.com/login/login.asp?p=pc"
      fields:
        company_code: "#companyID"      # 회사코드 input
        username:     "#userID"         # 아이디 input
        password:     "#userPWD"        # 비밀번호 input
      submit: "#sendLogin"              # 로그인 버튼(<a> → loginTry())
      success_wait: ""                  # 비우면 networkidle 대기. 로그인 후 메인 셀렉터 알면 넣어도 됨.

    # ── 매출상세목록 이동 ──
    report:
      url: ""                 # 매출상세목록 직접 URL 이 있으면 가장 안정적. 없으면 nav 사용.
      nav:                    # 메뉴 클릭 시퀀스(직접 URL 없을 때)
        - { click: "매출분석_메뉴_셀렉터", wait_ms: 800 }
        - { click: "매출상세목록_셀렉터", wait_ms: 800 }
      date_range_days: 0      # 0=전체 기간, 30=최근 30일(증분·가벼움)
      date_from_sel: ""       # 시작일 입력 셀렉터(있으면)
      date_to_sel: ""         # 종료일 입력 셀렉터(있으면)
      search_sel: ""          # 검색/조회 버튼 셀렉터(있으면)
      settle_ms: 1500         # 표 렌더 대기

  # 매장이 늘면 같은 형식으로 추가. 매장별 실제 데이터 디렉터리는 PII 라
  # .gitignore 에 'clients/<slug>/' 한 줄 추가하세요(hayewoni 처럼).
