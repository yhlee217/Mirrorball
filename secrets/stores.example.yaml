# 핸드SOS 자동 동기화 매장 설정 (이 파일을 stores.yaml 로 복사해서 채우세요)
# secrets/ 는 .gitignore 됨 — 자격증명은 절대 커밋되지 않습니다.
#
# 채울 건 매장당 딱 3개: 회사코드 · 아이디 · 비밀번호.
# (로그인 화면 셀렉터는 코드에 기본값으로 들어 있어 손댈 필요 없습니다.)

notify_url: ""        # (선택) 실패 알림 보낼 슬랙/디스코드 webhook URL

stores:
  - slug: hayewoni            # clients/{slug}/ 와 일치
    enabled: true
    staff: 하예원              # 이 담당자 행만 가져옴(한 계정에 여러 명일 때). 전체면 비움.

    # ── 핸드SOS 로그인 (이 3개만 채우면 됩니다) ──
    company_code: ""          # 회사코드 (로그인 화면 첫 칸 값)
    username: ""              # 아이디
    password: ""              # 비밀번호

    # ── 매출상세목록 위치 (처음 한 번 --debug 로 잡아서 채움) ──
    report:
      url: ""                 # --debug 실행 후 콘솔에 찍힌 매출상세목록 frame URL 을 넣으면 자동화 완료
      date_range_days: 0      # 0=전체 기간, 30=최근 30일(증분·가벼움)
      settle_ms: 1500         # 표 렌더 대기(ms)

  # 매장이 늘면 같은 형식으로 추가. 매장별 실데이터(clients/<slug>/)는 PII 라
  # .gitignore 에 'clients/<slug>/' 한 줄 추가하세요(hayewoni 처럼).
