# Instagram Graph API 자격증명 — 복사해서 secrets/instagram.yaml 로 채운다(git 제외).
#   copy secrets\instagram.example.yaml secrets\instagram.yaml   (Windows)
# 발급 절차는 scripts/INSTAGRAM_SETUP.md 참고.

ig_user_id: ""          # 인스타 '비즈니스 계정' ID (숫자). /me/accounts → /{page-id}?fields=instagram_business_account
access_token: ""        # 장기 토큰(60일) 또는 시스템 유저 토큰(무기한)
app_id: ""              # Meta 개발자 앱 ID (토큰 갱신용)
app_secret: ""          # Meta 개발자 앱 시크릿 (토큰 갱신용, 절대 외부 노출 금지)

# 추적 대상(레이트 리밋: 해시태그는 7일당 30개까지) — 지역×핵심스타일 + 우리/경쟁 브랜드 태그
hashtags:
  - "영등포미용실"
  - "영등포시장역미용실"
  - "영등포레이어드컷"
  - "영등포뿌리펌"
  - "레이어드펌"
  - "살롱톤"
  - "하예원"

competitors:            # 경쟁 '비즈니스 계정' username (개인계정은 조회 불가)
