# Instagram Graph API 자격증명 — 복사해서 secrets/instagram.yaml 로 채운다(git 제외).
#   copy secrets\instagram.example.yaml secrets\instagram.yaml   (Windows)
# 발급 절차는 scripts/INSTAGRAM_SETUP.md / .html 참고.
#
# 핵심: '렌즈 계정'(API 호출 주체)은 측정 대상과 분리됨.
#  - 렌즈는 컨시어지 본인 비즈니스 계정이어도 됨 → 살롱 공개 데이터는 Business Discovery 로 봄.
#  - 여러 클라이언트를 계정 하나로 모니터링 가능(B2B). 클라이언트 계정 안 건드림.
#  - 살롱 '비공개 인사이트(도달·노출)'·정확한 멘션이 필요할 때만 lens_is_salon: true.

# ── 렌즈(호출 주체) 계정 ──
ig_user_id: ""          # 렌즈 비즈니스 계정 ID (컨시어지 본인 계정 추천)
access_token: ""        # 장기(60일) 또는 시스템 유저 토큰(무기한)
app_id: ""              # 토큰 갱신용
app_secret: ""          # 토큰 갱신용(공개 금지)
lens_is_salon: false    # 렌즈가 살롱 본인 계정이면 true(비공개 인사이트·멘션까지)

# ── 측정 대상(클라이언트 살롱) ──
salon:
  username: "salontone_xxxx"          # 살롱 인스타 @username (Business Discovery 대상)
  hashtags: ["살롱톤", "하예원"]        # 우리 브랜드/디자이너 해시태그(언급량·점유율)

# ── 경쟁 비즈니스 계정 username (개인/비공개는 조회 불가) ──
competitors:
  - "competitor_salon_1"
  - "competitor_salon_2"

# ── 시장 트렌드용 해시태그 (지역×스타일) · 7일당 30개 한도 ──
market_hashtags:
  - "영등포미용실"
  - "영등포시장역미용실"
  - "영등포레이어드컷"
  - "영등포뿌리펌"
  - "레이어드펌"
