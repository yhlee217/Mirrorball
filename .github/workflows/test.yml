name: test

# 푸시마다 자동 검증(개선 계획 v13 P1) — 타입 검사 + 테스트(원장 앱 브라우저 테스트 포함).
# 실패하면 이 실행이 빨갛게 끝나고 GitHub 가 저장소 주인에게 메일을 보낸다(매일 감시와 같은 길).
# 전에는 테스트가 작업 세션에서만 돌았다 — 숫자를 바꾸는 실수도 그대로 배포될 수 있었다(Pages 빌드는 '컴파일되나'만 본다).
#
# 비밀값은 쓰지 않는다 — 테스트는 키 없이 돈다. 공개 저장소라 실행 비용이 없다.
# 화면 측정(UI 측정)은 글꼴이 달라 숫자가 흔들려 여기선 건너뛴다(tests/test_ui_audit.py — 컴파일 · 그리기만 확인).

"on":
  push:
    branches: [claude/charming-planck-hmgazi, main]
  workflow_dispatch: {}

permissions:
  contents: read             # 읽기만 — 아무것도 쓰지 않는다

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true   # 연달아 푸시하면 마지막 것만 본다

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            worker/requirements.txt
      - name: 웹 의존성
        working-directory: web
        run: npm ci
      - name: 파이썬 의존성
        run: pip install -r requirements.txt -r worker/requirements.txt pytest
      - name: 브라우저(원장 앱 · 수확 테스트)
        run: python -m playwright install --with-deps chromium
      - name: 타입 검사
        working-directory: web
        run: npx tsc --noEmit -p .
      - name: 테스트
        run: python -m pytest -q
