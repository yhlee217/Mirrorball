name: collect

# ⚠ HandSOS 는 국내 IP 만 허용 → GitHub Actions 러너(해외 IP)에서는 로그인 페이지 goto 가
# 타임아웃되어 수집이 구조적으로 불가능하다. 실제 수집은 매장 PC(맥 launchd, com.mirrorball.collect,
# 국내 IP)가 담당한다. 그래서 30분마다 실패하던 자동 스케줄(cron)을 제거한다(반복 실패 알림 방지).
# workflow_dispatch 만 남겨 디버그/수동 실행 여지는 둔다(단, 해외 IP 라 수집 자체는 여전히 실패).
"on":
  workflow_dispatch: {}

# 동시 수집 금지(코드리뷰 M6) — 스케줄과 수동 실행이 겹쳐 같은 테넌트를 동시 수집하면
# 한 실행의 delete_stale 이 다른 실행이 방금 쓴 예약을 지우는 등 레이스가 난다.
# 한 번에 하나만 돌게 직렬화(진행 중 실행은 끊지 않음 — 부분수집 방지).
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: deps
        run: |
          pip install -r worker/requirements.txt
          python -m playwright install --with-deps chromium
      - name: sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MIRRORBALL_KEK: ${{ secrets.MIRRORBALL_KEK }}
          SYNC_ALL: '1'
        run: python worker/run.py
