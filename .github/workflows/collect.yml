name: collect

# 무료 수집 워커 — GitHub Actions 크론(서버·비용 없음).
# KST 영업시간 10~20시 = UTC 1~11시, 30분마다. 수동 실행도 가능(workflow_dispatch).
# ⚠ 스케줄 트리거는 리포 '기본 브랜치'에 있는 워크플로만 동작 → 이 파일이 기본 브랜치에 있어야 함.
"on":
  schedule:
    - cron: '*/30 1-11 * * *'
  workflow_dispatch: {}

# 동시 수집 금지(코드리뷰 M6) — 스케줄과 수동 실행이 겹쳐 같은 테넌트를 동시 수집하면
# 한 실행의 delete_stale 이 다른 실행이 방금 쓴 예약을 지우는 등 레이스가 난다.
# 한 번에 하나만 돌게 직렬화(진행 중 실행은 끊지 않음 — 부분수집 방지).
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: deps
        run: |
          pip install -r worker/requirements.txt
          python -m playwright install --with-deps chromium
      - name: sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MIRRORBALL_KEK: ${{ secrets.MIRRORBALL_KEK }}
          SYNC_ALL: '1'
        run: python worker/run.py
