name: sync-health

# 맥 밖에서 수집을 감시한다. 맥이 꺼져 있어도, 크로미움이 없어도, 맥 알림을 놓쳐도 걸린다.
# 수집이 조용히 멈춘 걸 두 번 당한 뒤에 만들었다(2026-08 로그 파일 / 2026-09~10 크로미움 5주).
#
# 지연이면 이 실행이 '실패'로 끝나고, GitHub 가 저장소 소유자에게 메일을 보낸다.
# 비공개 알림 경로가 필요하면 ALERT_WEBHOOK 시크릿(슬랙/디스코드 웹훅 등)만 추가하면 된다.
#
# ⚠ 스케줄 워크플로는 '기본 브랜치'에서만 돈다(현재 claude/charming-planck-hmgazi).
# ⚠ 저장소에 60일간 활동이 없으면 GitHub 가 스케줄을 자동 비활성화한다.
#
# 곁따라오는 효과: 이 일일 호출이 Supabase 무료 플랜의 '비활성 일시정지' 타이머를 리셋한다.
# 주 1회 수집은 그 기준과 간격이 거의 같아 여유가 없었다.

"on":
  schedule:
    # 매일 01:07 UTC = 10:07 KST. 정시(:00)는 GitHub 스케줄이 가장 붐벼 4~6시간 늦게 돌았다(10.13~15 — 14:38 · 14:54 ·
    # 16:27 KST) → 정시를 피한다(개선 계획 v15 P3). 그래도 늦을 수 있다 — 판정은 '몇 시'가 아니라 '며칠'이라 상관없다.
    - cron: '7 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: read             # 더 줄 이유가 없다 — 판정만 하고 아무것도 쓰지 않는다

concurrency:
  group: sync-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: 수집 지연 확인
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          STALE_DAYS: '8'
          # 백업·화면 오류(0023 ops_health, 개선 계획 v5). 맥에 새 코드가 깔리고 첫 일요일 백업이 지난 뒤부터
          # 백업 기록이 없으면 실패한다 — 그 전엔 경고만.
          BACKUP_DAYS: '8'
          ERROR_LIMIT: '5'
          BACKUP_REQUIRED_SINCE: '2026-10-20'
          # 운영 숫자 감시 열쇠(0027, 개선 계획 v15 P2) — 서비스 키가 아니라 운영 숫자만 연다. 0027 전엔 비어 있어도 된다.
          OPS_WATCH_KEY: ${{ secrets.OPS_WATCH_KEY }}
          # DB 용량(0028) — 무료 플랜은 500MB 를 넘으면 읽기 전용. 400MB(80%)를 넘으면 실패로 알린다.
          DB_LIMIT_MB: '500'
          DB_WARN_MB: '400'
        run: python3 scripts/sync_health_check.py
