# 업종별 카피 데이터 (헤어 기본값).
# 다른 업종(네일·속눈썹·타투·필라테스)으로 복제할 땐 '이 파일만' 교체하면 된다.
# Python(drafts.py·aftercare.py)과 PWA 앱(build_app 이 주입)이 같은 소스를 쓴다 = 이중정의 제거.

business_type: HairSalon        # schema.org @type (예: NailSalon / BeautySalon / HealthClub)
service_noun: 시술               # "시술 이력 / 인기 시술 / 시술 후 관리" 등에 쓰는 명사

# 빠른 태그 — 폼에서 '탭 한 번'으로 취향·주의점 입력(타이핑·녹음 부담 없는 기본 동선).
# 복제 시 업종에 맞게 교체(네일=연장 선호/오프 자주 등).
quick_tags:
  - 손상 민감
  - 두피 예민
  - 밝은 톤 선호
  - 어두운 톤 선호
  - 자연스러움 선호
  - 볼륨 원함
  - 펌 잘 풀림
  - 수다 좋아함
  - 조용히 선호
  - 시간 촉박
  - 가격 민감
  - 단골

# 재방문 권유 이유: 시술 키워드(부분일치) → 한 줄 문구
benefit:
  default: "시기 맞춰 가볍게 정리하면 더 예쁘게 유지돼요"
  rules:
    - keywords: [펌, perm]
      text: "풀리기 전에 한 번 더 잡으면 한동안 손질이 편하실 거예요"
    - keywords: [발레아주, 컬러, 염색, 톤]
      text: "뿌리 올라오기 전에 톤 정리하면 화사하게 유지돼요"
    - keywords: [클리닉, 트리트먼트]
      text: "결이 가라앉기 전에 한 번 케어하면 컨디션이 오래가요"
    - keywords: [컷, 커트, 단발]
      text: "라인 흐트러지기 전에 다듬으면 스타일이 오래가요"

# 애프터케어 팁: 시술 키워드(부분일치) → 팁 목록
aftercare:
  default: ["가벼운 관리로도 스타일이 오래 유지돼요. 궁금한 점은 편하게 물어보세요!"]
  rules:
    - keywords: [펌, perm, 볼륨]
      tips:
        - "첫 24~48시간은 감거나 꽉 묶지 마세요 (컬이 자리잡는 시간)"
        - "전용 펌 샴푸·트리트먼트로 컬을 더 오래 유지"
        - "드라이는 디퓨저로 가볍게, 비비지 말고 쥐어짜듯"
    - keywords: [발레아주, 컬러, 염색, 톤, 색]
      tips:
        - "첫 2~3일은 약산성 샴푸로 색 빠짐 최소화"
        - "너무 뜨거운 물·잦은 샴푸는 탈색을 촉진해요"
        - "자외선·수영장 염소는 변색 원인 — 외출 시 주의"
    - keywords: [클리닉, 트리트먼트, 케어]
      tips:
        - "3~4일은 강한 세정 대신 영양을 유지해 주세요"
        - "고데기·드라이는 온도를 한 단계 낮춰서"
    - keywords: [컷, 커트, 단발, 숏]
      tips:
        - "2~3주에 한 번 끝 정리하면 라인이 오래가요"
        - "드라이 방향만 잡아줘도 모양이 살아요"
